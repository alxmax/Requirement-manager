ck, an underscore-prefixed filename, or a leading UTF-8 BOM are all handled without raising. [[REQ-PARSE-892]]"],acc:["A file with valid frontmatter yields its scalar and list fields in `meta`.","A file without a leading `---` block returns empty `meta` and the whole text as body.","Files starting with `_` are excluded from the result."],impl:["`parse_frontmatter`, `load_requirements` in `reqmap.py`."],members:[{role:"implements",loc:"scripts/reqmap.py:73-128"},{role:"tested-by",loc:"scripts/test_reqmap.py:47-800"}],deps:[],usedBy:["ARCH-CHECK-006","ARCH-FINDINGS-010","ARCH-MAP-007","ARCH-NEW-004","ARCH-PROMOTE-011"],risks:[{signal:"blast-radius",advice:"High fan-in — many capabilities depend on this. Change it only behind its contract, run the full gate + dependents' tests."}]},{id:"ARCH-SCAN-002",area:"CORE",title:"Member discovery",layer:"bus",status:"confirmed",intent:"Find every place in the code that claims membership of a capability, by scanning for tags.",contract:["`scan_members` walks a code root and, in every source file with a known extension, finds inline `role: <ID>` tags and returns `cap_id -> [(role, relative_file, line), ...]`. [[REQ-SCAN-908]]","A single tag may bind several requirements through a comma-separated id list, written `role: <ID>, <ID>, ...`, and `scan_all` runs member, per-criterion and test-level scanning in one walk. [[REQ-SCAN-909]]"],acc:["A file containing `# implements: <ID>` produces a member `(implements, file, line)` under `<ID>`.","Excluded directories are not scanned; member paths are POSIX-relative.","An unreadable file is skipped without aborting the scan."],impl:["`scan_members`, `_prune_dirs`, `load_ignore`, `TAG_RE` in `reqmap.py`."],members:[{role:"implements",loc:"scripts/reqmap.py:144-181"},{role:"tested-by",loc:"scripts/test_reqmap.py:146"}],deps:[],usedBy:["ARCH-CANDIDATES-009","ARCH-CHECK-006","ARCH-EXTRACT-008","ARCH-MAP-007"],risks:[{signal:"blast-radius",advice:"High fan-in — many capabilities depend on this. Treat it as shared foundation (bus)."}]},{id:"ARCH-DRIFT-003",area:"CORE",title:"Contract hashing & lock",layer:"bus",status:"confirmed",intent:"Detect when a requirement's binding contract changes, so stale code can be re-checked.",contract:["`binding_hash` computes a stable 12-character hex content hash over only the normative sections of a requirement body. [[REQ-DRIFT-841]]","`load_lock`/`save_lock` read and write the per-id hash baseline at `requirements/_reqlock.json`, failing open to `{}` on a missing or corrupt file. [[REQ-DRIFT-842]]"],acc:["Editing only the Description/Notes section does not change the hash.","Editing the Contract section changes the hash.","`load_lock` on a missing or corrupt lock file returns an empty dict (no crash)."],impl:["`binding_hash`, `lock_path`, `load_lock`, `save_lock` in `reqmap.py`."],members:[{role:"implements",loc:"scripts/reqmap.py:209-240"},{role:"tested-by",loc:"scripts/test_reqmap.py:103-116"}],deps:[],usedBy:["ARCH-CHECK-006"],risks:[{signal:"drift",advice:"Lock hash differs from current contract. Re-check the named members, then `check --update-lock`."}],drift:!0},{id:"ARCH-CHECK-006",area:"REQ",title:"The gate",layer:"feature",status:"confirmed",intent:"Fail the build when code and requirements have fallen out of sync.",contract:["`gate` reports an `ERROR` and exits non-zero for a dangling tag, an invalid status/layer/form/level, a missing `depends_on` target, or an enforced requirement with no `implements:` member. [[REQ-CHECK-828]] details the behaviour.","`gate` warns (not errors) on contract drift against the lock, a confirmed requirement with no `tested-by:` link, or a confirmed requirement missing its `## Description`/`## Cases` section; `--strict` promotes most of these to errors. [[REQ-CHECK-829]] details the behaviour.","`gate` warns on a malformed `milestone:` value, and on a corrupt or git-untracked lock file, without affecting the exit code. [[REQ-CHECK-830]] details the behaviour.","`gate` counts legacy-

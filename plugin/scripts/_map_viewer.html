 block-style lists written as `key:` then indented `- item`.","A trailing `# comment` is stripped from a value.","Matching surrounding quotes are removed from a scalar.","An inline list missing its closing `]` is parsed leniently, rather than kept as a literal string.","A file with no leading `---` block yields empty `meta` and the whole text as `body`.","A file whose name starts with `_` (a lock, the generated map) is excluded.","A leading UTF-8 BOM is tolerated."],acc:["A file with valid frontmatter yields its scalar and list fields in `meta`.","A file without a leading `---` block returns empty `meta` and the whole text as body.","Files starting with `_` are excluded from the result."],impl:["`parse_frontmatter`, `load_requirements` in `reqmap.py`."],members:[{role:"implements",loc:"scripts/reqmap.py:73-128"},{role:"tested-by",loc:"scripts/test_reqmap.py:47-800"}],deps:[],usedBy:["ARCH-CHECK-006","ARCH-FINDINGS-010","ARCH-MAP-007","ARCH-NEW-004","ARCH-PROMOTE-011","ARCH-SCAN-005"],risks:[{signal:"blast-radius",advice:"High fan-in — many capabilities depend on this. Change it only behind its contract, run the full gate + dependents' tests."}]},{id:"ARCH-SCAN-002",area:"CORE",title:"Member discovery",layer:"bus",status:"confirmed",intent:"Find every place in the code that claims membership of a capability, by scanning for tags.",contract:["`scan_members` walks a code root and, in every source file with a known extension, finds the inline tags.","`scan_members` returns `cap_id -> [(role, relative_file, line), ...]`.","A role is one of `implements`, `generated-from`, `validated-against` and `tested-by`.","A tag ID matches `[A-Z][A-Z0-9]*(-[A-Z0-9]+)+`.","A left-boundary guard prevents a substring match such as `reimplements:` or `x-implements:` being read as a real tag.","The same `(role, ID)` appearing twice on one line is recorded once.","File paths are reported repo-root-relative, with POSIX separators.","A single tag may bind several requirements through a comma-separated id list, written `role: <ID>, <ID>, ...`.","Each id in that list is recorded as a member of the same `(role, file, line)`.","A whole-system doc generated from many requirements (`generated-from: A, B, C`) is therefore a member of each, and drifts when ANY of them changes.","`.git`, `node_modules`, `__pycache__` and the SSOT `requirements/` directory are skipped.","The SSOT directory is matched by realpath, so a source package merely named `requirements/` is still scanned.","Paths matching `.reqmapignore` are excluded.","An unreadable file is skipped without aborting the scan.","`scan_all` returns the members, the per-criterion coverage and the verification levels from a single walk, and each result equals what the three separate scanners return."],acc:["A file containing `# implements: <ID>` produces a member `(implements, file, line)` under `<ID>`.","Excluded directories are not scanned; member paths are POSIX-relative.","An unreadable file is skipped without aborting the scan."],impl:["`scan_members`, `_prune_dirs`, `load_ignore`, `TAG_RE` in `reqmap.py`."],members:[{role:"implements",loc:"scripts/reqmap.py:144-181"},{role:"tested-by",loc:"scripts/test_reqmap.py:146"}],deps:[],usedBy:["ARCH-CANDIDATES-009","ARCH-CHECK-006","ARCH-EXTRACT-008","ARCH-MAP-007","ARCH-SCAN-005"],risks:[{signal:"blast-radius",advice:"High fan-in — many capabilities depend on this. Treat it as shared foundation (bus)."}]},{id:"ARCH-DRIFT-003",area:"CORE",title:"Contract hashing & lock",layer:"bus",status:"confirmed",intent:"Detect when a requirement's binding contract changes, so stale code can be re-checked.",contract:["`binding_hash` computes a stable 12-character hex content hash over only the normative sections of a requirement body.","The normative sections are the `Contract` and `Acceptance` headings, plus the legacy `Input`/`Output`/`Acceptance` headings kept for back-compat.","Rationale, notes, verify-intent, links and the member list stay outside the hash, so they may change without tripping drift.","The hash is deterministic for identical normative content.","`load_lock` and `save_lock` read and write the per-id hash baseline at `requirements/_reqlock.json`.","A missing, empty or unparseable lock loads as an empty mapping, never a crash.","`save_lock` creates the requirements directory if it is absent.","`save_lock` writes sorted, indented JSON, so the lock file is diff-stable."],acc:["Editing only the Description/Notes section does not change the hash.","Editing the Contract section changes the hash.","`load_lock` on a missing or corrupt lock file returns an empty dict (no crash)."],impl:["`binding_hash`, `lock_path`, `load_lock`, `save_lock` in `reqmap.py`."],members:[{role:"implements",loc:"scripts/reqmap.py:209-240"},{role:"tested-by",loc:"scripts/test_reqmap.py:103-116"}],deps:[],usedBy:["ARCH-CHECK-006"],risks:[{signal:"drift",advice:"Lock hash differs from current contract. Re-check the named members, then `check --update-lock`."}],drift:!0},{id:"ARCH-CHECK-006",area:"REQ",title:"The gate",layer:"feature",status:"confirmed",intent:"Fail the build when code and requirements have fallen out of sync.",contract:[["`gate` reports an `ERROR` and exits non-zero for every condition in this group.","A dangling tag — a code tag referencing a capability no requirement defines — is such a condition.","An invalid `status` or an invalid `layer` is such a condition.","A `depends_on` pointing at a missing id is such a condition.","An enforced requirement with no `implements:` member is such a condition.","A requirement is enforced when its status is `in-progress`, `implemented` or `confirmed`.","A `layer: need` requirement is exempt from that `implements:` rule — see [[ARCH-TRACE-020]].","`gate` reports drift as a `WARN`, never an error: a `confirmed` requirement whose binding hash differs from the lock.","The drift warning names the member `file:line` locations to re-check.","A `confirmed` requirement with no `tested-by:` member is a `WARN`.","A requirement carrying a `test_exempt: <reason>` opt-out in its frontmatter is exempt from that test warning.","A `layer: need` requirement is exempt from it too.","A `confirmed` requirement missing a `## Description` section is a `WARN`, in both the `bus` and `feature` layers. It does not affect the exit code.","A `confirmed` requirement missing a `## Cases` section is a `WARN`, in both the `bus` and `feature` layers. It does not affect the exit code.","The requirement `milestone:` field is optional. When present it matches the version shape `v<digits>[.<digits>…]`, for example `v1.14`.","A malformed `milestone:` value is a `WARN`, because that field is roadmap-only metadata and never build-critical.","A `deprecated` requirement is exempt from the `milestone:` shape check.","A present-but-unreadable `_reqlock.json` is a `WARN`. Drift is skipped for that run rather than crashing.","A lock sidecar (`_reqlock.json` or `_memberlock.json`) that exists on disk but is **not git-tracked** is a `WARN` naming the file.","An uncommitted lock silently disables drift detection on a fresh CI checkout, which has no baseline to compare against.","That git-tracking check is fail-open: `gate` stays silent when git is unavailable or the tree is not a work tree.","`gate` names every requirement whose body lacks a `## Verify intent` section in one aggregated legacy-schema `WARN`.","`gate` counts those legacy-schema requirements in the summary.","The legacy-schema warning does not affect the exit code.","A confirmed `need` with no `validated-against:` member is a `WARN`, once the repo carries at least one such tag (see [[ARCH-VLEVEL-037]]).","A confirmed `bus` requirement whose levelled `tested-by:` links are all `@system` is a `WARN`.","A `depends_on` cycle is a `WARN` naming the whole chain, once per distinct cycle.","The cycle warning stays a warning under `--strict`, so an existing corpus keeps its exit code when the engine is upgraded.","`gate` prints an advisory line carrying the open verify-intent finding count when that count is above zero.","That advisory line does not affect the exit code.","`gate` prints a summary of requirements, members, errors and warnings.","With `--update-lock`, `gate` writes the current binding hashes to `requirements/_reqlock.json`.","`sync` and the deprecated `check` alias pass `--update-lock`.","The `gate` verb itself is report-only."]],acc:["A tag referencing a non-existent capability produces an `ERROR` and exit 1.","A `confirmed` requirement with no `implements` member produces an `ERROR`.","A drifted contract produces a `WARN` (not an error) naming the member locations."],impl:["`cmd_check`, `warn_if_stale` in `reqmap.py`."],members:[{role:"implements",loc:"scripts/reqmap.py:247-296"},{role:"tested-by",loc:"scripts/test_reqmap.py:93-958"}],deps:["ARCH-PARSE-001","ARCH-SCAN-002","ARCH-DRIFT-003"],usedBy:["ARCH-INIT-012"],risks:[]},{id:"ARCH-EXTRACT-008",area:"REQ",title:"Legacy extraction",layer:"feature",status:"confirmed",intent:"Bootstrap a registry on a brownfield codebase by proposing draft requirements from untagged code.",contract:["`draft` walks every untagged scannable code file — the extensions and basenames the scan reads — plus prose in the capability bucket.","`draft` skips a file that already carries a member tag.","`draft` honors `.reqmapignore`, the same fnmatch globs `scan` respects.","A file matching an ignore pattern is never drafted — notably the vendored `scripts/reqmap.py` engine itself.","`draft` proposes one `requirements/DRAFT-*.md` per remaining file.","Every proposal carries `status: draft` and a TODO body. It captures observed behavior, and never canonizes intent or correctness.",'A proposal\'s Contract section opens with "Every bullet below is binding.", matching what `new` scaffolds, so promoting a draft needs no reshaping.',"`draft` creates the requirements directory if it is absent.","Draft ids are path-aware, so two files sharing a basename do not collide.","`draft` as r carry a count.","With zero findings, `findings` still writes a well-formed file stating that none are open.","With the raw flag set, `findings` ignores any sidecar and emits the raw grouped list.","When the sidecar exists and raw mode is off, `findings` renders a classified view.","That view puts confirmed bugs first, ordered by severity from high to low, then product/config decisions, then intentional, then false-positive.","A bug entry shows its location and its recommended fix when those are present.","`findings` emits an advisory staleness note when the count of raw verify-intent items differs from the count of triaged items in the sidecar.","`findings` is deterministic and stdlib-only. It never classifies a finding itself.","`findings` writes no file other than `_findings.md`.","`map` rewrites `_findings.md` when that file already exists. `sync` runs `map`, so it refreshes a committed report along with the map.","`map` never creates `_findings.md`. Running `findings` once opts a repo in.","`map --check` reports `_findings.md` stale when the committed copy differs from a fresh render, the same way it judges `_map.md` and `_map.json`. An absent file is never stale.","The gate prints a non-error advisory line carrying the open-findings count, whenever that count is greater than zero.","The open-findings count never changes the gate's exit code."],gwt:`AC-1

ulti-line clause is never truncated to its first physical line.","A clause-group label groups the clauses below it: a bold-only line written flush left. A label is a heading, not a clause, and never folds into the clause above.","Position decides a label, not the bold markers alone. An indented wrapped line folds even when it opens and closes on bold spans, so a two-part clause keeps both halves.","The `intent` field carries a requirement's first blockquote, joined into one line.","The `intent` field is empty when that quote and the Contract say the same thing.","An atomic requirement is that case: its quote is its single obligation, so the map emits the text once, under `contract`.","`show` follows the same rule, printing no intent line above a Contract that repeats it.","`map --check` fails when a committed generated file differs from a fresh render.","The gate reports the same staleness as a warning, so a commit prepared with `gate` alone cannot be surprised by that failure in CI.","The gate never regenerates the map. It only reports.","All requirement-derived text is JSON-encoded in `_map.json`, which neutralizes any hostile id, title or body by construction. There is no markup context to break out of."]],acc:["The generated files contain one node per requirement and one edge per `depends_on`.","`_map.md` contains 4 Mermaid code blocks, each with a legend.","`_map.json` parses to `{engine_version, nodes, edges}` with one node per requirement."],impl:["`cmd_map`, `render_html`, `render_md`, the `_mermaid_*` generators in `reqmap.py`."],members:[{role:"implements",loc:"scripts/reqmap.py:1033-1948"},{role:"tested-by",loc:"scripts/test_reqmap.py:237-1069"}],deps:["ARCH-PARSE-001","ARCH-SCAN-002"],usedBy:["ARCH-INIT-012","ARCH-NEXT-013"],risks:[]},{id:"ARCH-NEW-004",area:"REQ",title:"Scaffold a requirement",layer:"feature",status:"confirmed",intent:"Create a new requirement file from the template, so every capability starts in the same shape.",contract:["Given a capability id, `new` writes `requirements/<ID>.md`, stamped from the scaffold with the placeholder `AREA-NAME-NNN` replaced by that id.","`new` creates the requirements directory if it is absent.","The scaffold is the engine's built-in template.","An on-disk `templates/requirement.md`, when present, overrides the built-in template.","`new` refuses to overwrite an existing file. It exits non-zero and writes nothing.",'The emitted Contract section opens with "Every bullet below is binding.", so the author writes clauses in present tense without a `shall` or `must` on each line.',"The scaffold's guidance names the authoring rules the linter enforces, so a file written from it starts clean.","`new` warns, and still exits zero, when another requirement in the same area already uses the same `NNN` number. Ids stay unique by their full text; the warning keeps numbers unambiguous in conversation."],acc:["`new FOO-NEW-099` on an empty registry creates `requirements/FOO-NEW-099.md` with that id.","Running `new` for an id that already exists exits non-zero and writes nothing."],impl:["`cmd_new`, `REQUIREMENT_TEMPLATE` in `reqmap.py`."],members:[{role:"implements",loc:"scripts/reqmap.py:425"},{role:"tested-by",loc:"scripts/test_reqmap.py:463"}],deps:["ARCH-PARSE-001"],usedBy:[],risks:[]},{id:"ARCH-PROMOTE-011",area:"REQ",title:"Promote",layer:"feature",status:"confirmed",intent:"One command to perform the human-validation step — flip a reviewed requirement to confirmed.",contract:[["`confirm <ID>` sets the requirement's `status` to `confirmed`.","`confirm` edits only the value of the first `status:` line in the leading frontmatter.","`confirm` preserves that line's indentation and any trailing inline comment.","`confirm` leaves the body untouched.","`confirm` refuses a requirement with no `implements:` member: it exits non-zero and writes nothing. A `confirmed` requirement with no code is a gate error.","`confirm` exempts a `need` and an `aggregate` from that rule, matching the gate. Both are covered by an edge rather than by a tag.","`confirm` refuses an `aggregate` whose `depends_on` list is empty, because an aggregate with no dependency is an orphan.","A refusal prints the tag the caller needs to add.","`confirm` exits non-zero with a clear message for an unknown id, meaning no `requirements/<ID>.md` exists.","`confirm` warns, without failing, when no `tested-by:` member is linked.","That warning points at the test tag to add, or at the `test_exempt:` opt-out.","`confirm` reminds the caller to refresh the lock and regenerate the map afterwards.","`confirm` is idempotent. An already-`confirmed` requirement is reported, left unchanged, and exits zero."]],gwt:`AC-1

ose lines every member is counted twice and the copies' tags read as dangling refs: errors that are not in the code, in files a clean CI checkout never has.","One exception: if the engine describes itself in this repo, `init` leaves the line out and writes a comment saying why. There the engine is ordinary tracked code, so the scan keeps reading it.",'"Describes itself" means `scripts/reqmap.py` carries tags whose ids match requirements already in the repo.',"`init` drafts requirements from untagged code, writes the lock, then builds the map, in that order. When it finishes, the repo passes the gate and has a map.","`init` ends with a short summary naming one next command: `reqmap.py next`. Not a list of every option.","If nothing was drafted, `init` says so in plain words and points at `new`. It never prints a count summary that hides an empty result.","Running `init` twice is safe. The second run refreshes the lock and the map, then prints the summary again.","A second run never deletes a requirement someone wrote, and never edits an existing `.reqmapignore`."],acc:["`init` on a fresh repo creates `requirements/` and a `.reqmapignore`.","After `init`, `_map.md`, `_map.json` and the drift lock exist.",'`init` on a repo with no extractable code prints the distinct "no requirements were extracted" message.'],impl:["`cmd_init` in `reqmap.py` — orchestrates extract → check → map."],members:[{role:"implements",loc:"scripts/reqmap.py:1210-1237"},{role:"tested-by",loc:"scripts/test_reqmap.py:1265"}],deps:["ARCH-EXTRACT-008","ARCH-CHECK-006","ARCH-MAP-007"],usedBy:[],risks:[]},{id:"ARCH-NEXT-013",area:"REQ",title:"What-should-I-do-next report",layer:"feature",status:"confirmed",intent:"Render the map's risk surface in the terminal as counted, actionable buckets.",contract:["`next` groups every requirement's open risk signals into action buckets.","`next` reads those signals from `_risk_signals` and their wording from `RISK_ADVICE`, the same two sources that drive the Risk

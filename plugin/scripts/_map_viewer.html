l module yields a `depends_on` edge to that module's candidate.","A module imported by ≥ the bus threshold is suggested as `bus`."],impl:["`cmd_candidates`, `_py_facts`, `_js_facts`, `_load_capmap` in `reqmap.py`."],members:[{role:"implements",loc:"scripts/reqmap.py:658-805"},{role:"tested-by",loc:"scripts/test_reqmap.py:521-908"}],deps:["ARCH-SCAN-002"],usedBy:[],risks:[]},{id:"ARCH-FINDINGS-010",area:"REQ",title:"Open-findings report",layer:"feature",status:"confirmed",intent:`Roll up every requirement's open "verify intent" questions into one reviewable _findings.md.`,contract:["`sync` collects the bullet items under each requirement's `## Verify intent` section. [[REQ-FINDINGS-853]]","In raw mode, `sync` groups the collected findings by requirement and writes the raw report. [[REQ-FINDINGS-854]]","When a `_findings_triage.json` sidecar exists and raw mode is off, `sync` renders a classified view ordered by severity. [[REQ-FINDINGS-855]]","`sync` is deterministic and stdlib-only; `map` and `gate` fold its output in without ever classifying a finding themselves. [[REQ-FINDINGS-856]]"],gwt:`AC-1

ts/<ID>.md`, stamped from the scaffold (an on-disk `templates/requirement.md` if present, else the built-in template) with the placeholder `AREA-NAME-NNN` replaced by that id, creating the requirements directory if needed. [[REQ-NEW-881]]","`new` refuses to overwrite an existing file, exiting non-zero and writing nothing; it warns but still succeeds on a same-area number collision, and its scaffold is pre-shaped to pass the linter's own authoring rules. [[REQ-NEW-882]]"],acc:["`new FOO-NEW-099` on an empty registry creates `requirements/FOO-NEW-099.md` with that id.","Running `new` for an id that already exists exits non-zero and writes nothing."],impl:["`cmd_new`, `REQUIREMENT_TEMPLATE` in `reqmap.py`."],members:[{role:"implements",loc:"scripts/reqmap.py:425"},{role:"tested-by",loc:"scripts/test_reqmap.py:463"}],deps:["ARCH-PARSE-001"],usedBy:[],risks:[]},{id:"ARCH-PROMOTE-011",area:"REQ",title:"Confirmation is a human's answer",layer:"feature",status:"draft",intent:"Confirming is not a command — a human writes the status, and an edit takes it back.",contract:["There is **no `confirm` command.** A status is set by editing the frontmatter, which is what a human sign-off is: someone read it and wrote it down. The engine still owns the edit mechanics, so nothing else has to get them right. [[REQ-PROMOTE-894]] details the behaviour.","**An edited confirmed contract goes back to `draft`.** When `sync` finds that a `confirmed` or `implemented` requirement's binding content no longer matches the lock, it writes `draft` into that requirement and advances the baseline. [[REQ-PROMOTE-974]] details the behaviour.",'**`--accept-drift` is the escape hatch, and it is a human saying so:** it keeps the status and advances the baseline. It exists because "I edited it and it is still valid" is a real answer — it just has to be given, not assumed.',"**The invariant that a confirmed requirement points at code is enforced by the gate, not by a command.** `RM006` is an error, so a status written by hand with no `implements:` member fails at the next run."],gwt:`CASE-1

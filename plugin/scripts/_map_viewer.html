ile containing `# implements: <ID>` produces a member `(implements, file, line)` under `<ID>`.","Excluded directories are not scanned; member paths are POSIX-relative.","An unreadable file is skipped without aborting the scan."],impl:["`scan_members`, `_prune_dirs`, `load_ignore`, `TAG_RE` in `reqmap.py`."],members:[{role:"implements",loc:"scripts/reqmap.py:144-181"},{role:"tested-by",loc:"scripts/test_reqmap.py:146"}],deps:[],usedBy:["ARCH-CANDIDATES-009","ARCH-CHECK-006","ARCH-EXTRACT-008","ARCH-MAP-007"],risks:[{signal:"blast-radius",advice:"High fan-in — many capabilities depend on this. Treat it as shared foundation (bus)."}]},{id:"ARCH-DRIFT-003",area:"CORE",title:"Contract hashing & lock",layer:"bus",status:"confirmed",intent:"Detect when a requirement's binding contract changes, so stale code can be re-checked.",contract:["`binding_hash` computes a stable 12-character hex content hash over only the normative sections of a requirement body. [[REQ-DRIFT-841]]","`load_lock`/`save_lock` read and write the per-id hash baseline at `requirements/_reqlock.json`, failing open to `{}` on a missing or corrupt file. [[REQ-DRIFT-842]]","Waiving the drift check records who was waived and why, in a versioned sidecar the diff shows, so the one escape hatch in the gate is not also the one thing nobody reviews. [[REQ-DRIFT-988]]"],acc:["Editing only the Description/Notes section does not change the hash.","Editing the Contract section changes the hash.","`load_lock` on a missing or corrupt lock file returns an empty dict (no crash)."],impl:["`binding_hash`, `lock_path`, `load_lock`, `save_lock` in `reqmap.py`."],members:[{role:"implements",loc:"scripts/reqmap.py:209-240"},{role:"tested-by",loc:"scripts/test_reqmap.py:103-116"}],deps:[],usedBy:["ARCH-CHECK-006"],risks:[{signal:"drift",advice:"Lock hash differs from current contract. Re-check the named members, then `check --update-lock`."}],drift:!0},{id:"ARCH-CHECK-006",area:"REQ",title:"The gate",layer:"feature",status:"confirmed",intent:"Fail the build when code and requirements have fallen out of sync.",contract:["`gate` reports an `ERROR` and exits non-zero for a dangling tag, an invalid status/layer/form/level, a missing `depends_on` target, or an enforced requirement with no `implements:` member. [[REQ-CHECK-828]] details the behaviour.","`gate` warns (not errors) on contract drift against the lock, a confirmed requirement with no `tested-by:` link, or a confirmed requirement missing its `## Description`/`## Cases` section; `--strict` promotes most of these to errors. [[REQ-CHECK-829]] details the behaviour.","`gate` warns on a malformed `milestone:` value, and on a corrupt or git-untracked lock file, without affecting the exit code. [[REQ-CHECK-830]] details the behaviour.","`gate` counts legacy-schema requirements in its summary and warns, without affecting the exit code, on an unvalidated confirmed need, a bus requirement tested only at `@system`, or a `depends_on` cycle. [[REQ-CHECK-831]] details the behaviour.","`gate` prints the open verify-intent finding count and a summary of requirements, members, errors and warnings; neither affects the exit code. [[REQ-CHECK-832]] details the behaviour.","With `--update-lock` — always passed by `sync` — `gate` writes the current binding hashes to `requirements/_reqlock.json`; the bare `gate` verb is otherwise report-only. [[REQ-CHECK-833]] details the behaviour."],acc:["A tag referencing a non-existent capability produces an `ERROR` and exit 1.","A `confirmed` requirement with no `implements` member produces an `ERROR`.","A drifted contract produces a `WARN` (not an error) naming the member locations."],impl:["`cmd_check`, `warn_if_stale` in `reqmap.py`."],members:[{role:"implements",loc:"scripts/reqmap.py:247-296"},{role:"tested-by",loc:"scripts/test_reqmap.py:93-958"}],deps:["ARCH-PARSE-001","ARCH-SCAN-002","ARCH-DRIFT-003"],usedBy:["ARCH-INIT-012"],risks:[]},{id:"ARCH-EXTRACT-008",area:"REQ",title:"Legacy extraction",layer:"feature", es[], imports[], depends_on[], tested_by[], importer_count, existing_req, loc, split_candidate, is_test}`. [[REQ-CANDIDATES-827]]","The plan and the write path read ONE definition of an already-covered file, so a file the write path would skip is never reported as new. [[REQ-PLANTAGGED-1005]]","The plan states the rung of every candidate it would draft and the upper rungs the same run would mint, so the pyramid is visible before anything is written. [[REQ-PLANLEVEL-1006]]","Each candidate the write path would draft also states the id that write path will mint for it, without either id being renamed. [[REQ-PLANDRAFTID-1010]]"],acc:["Running `candidates` writes zero `.md` files and emits valid JSON.","An import of a local module yields a `depends_on` edge to that module's candidate.","A module imported by ≥ the bus threshold is suggested as `bus`."],impl:["`cmd_candidates`, `_py_facts`, `_js_facts`, `_load_capmap` in `reqmap.py`."],members:[{role:"implements",loc:"scripts/reqmap.py:658-805"},{role:"tested-by",loc:"scripts/test_reqmap.py:521-908"}],deps:["ARCH-SCAN-002"],usedBy:[],risks:[]},{id:"ARCH-FINDINGS-010",area:"REQ",title:"Open-findings report",layer:"feature",status:"confirmed",intent:`Roll up every requirement's open "verify intent" questions into one reviewable _findings.md.`,contract:["`sync` collects the bullet items under each requirement's `## Verify intent` section. [[REQ-FINDINGS-853]]","In raw mode, `sync` groups the collected findings by requirement and writes the raw report. [[REQ-FINDINGS-854]]","When a `_findings_triage.json` sidecar exists and raw mode is off, `sync` renders a classified view ordered by severity. [[REQ-FINDINGS-855]]","`sync` is deterministic and stdlib-only; `map` and `gate` fold its output in without ever classifying a finding themselves. [[REQ-FINDINGS-856]]"],gwt:`AC-1

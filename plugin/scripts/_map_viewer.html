tures[], imports[], depends_on[], tested_by[], importer_count, existing_req, loc, split_candidate, is_test}`. [[REQ-CANDIDATES-827]]","The plan and the write path read ONE definition of an already-covered file, so a file the write path would skip is never reported as new. [[REQ-PLANTAGGED-1005]]","The plan states the rung of every candidate it would draft and the upper rungs the same run would mint, so the pyramid is visible before anything is written. [[REQ-PLANLEVEL-1006]]","Each candidate the write path would draft also states the id that write path will mint for it, without either id being renamed. [[REQ-PLANDRAFTID-1010]]"],acc:["Running `candidates` writes zero `.md` files and emits valid JSON.","An import of a local module yields a `depends_on` edge to that module's candidate.","A module imported by ≥ the bus threshold is suggested as `bus`."],impl:["`cmd_candidates`, `_py_facts`, `_js_facts`, `_load_capmap` in `reqmap.py`."],members:[{role:"implements",loc:"scripts/reqmap.py:658-805"},{role:"tested-by",loc:"scripts/test_reqmap.py:521-908"}],deps:["ARCH-SCAN-002"],usedBy:[],risks:[]},{id:"ARCH-FINDINGS-010",area:"REQ",title:"Open-findings report",layer:"feature",status:"confirmed",intent:`Roll up every requirement's open "verify intent" questions into one reviewable _findings.md.`,contract:["`sync` collects the bullet items under each requirement's `## Verify intent` section. [[REQ-FINDINGS-853]]","In raw mode, `sync` groups the collected findings by requirement and writes the raw report. [[REQ-FINDINGS-854]]","When a `_findings_triage.json` sidecar exists and raw mode is off, `sync` renders a classified view ordered by severity. [[REQ-FINDINGS-855]]","`sync` is deterministic and stdlib-only; `map` and `gate` fold its output in without ever classifying a finding themselves. [[REQ-FINDINGS-856]]"],gwt:`AC-1

indented `- item`.","A trailing `# comment` is stripped from a value.","Matching surrounding quotes are removed from a scalar.","An inline list missing its closing `]` is parsed leniently, rather than kept as a literal string.","A file with no leading `---` block yields empty `meta` and the whole text as `body`.","A file whose name starts with `_` (a lock, the generated map) is excluded.","A leading UTF-8 BOM is tolerated."],acc:["A file with valid frontmatter yields its scalar and list fields in `meta`.","A file without a leading `---` block returns empty `meta` and the whole text as body.","Files starting with `_` are excluded from the result."],impl:["`parse_frontmatter`, `load_requirements` in `reqmap.py`."],members:[{role:"implements",loc:"scripts/reqmap.py:73-128"},{role:"tested-by",loc:"scripts/test_reqmap.py:47-800"}],deps:[],usedBy:["REQ-CHECK-006","REQ-FINDINGS-010","REQ-MAP-007","REQ-NEW-004","REQ-PROMOTE-011","REQ-SCAN-005"],risks:[{signal:"blast-radius",advice:"High fan-in — many capabilities depend on this. Change it only behind its contract, run the full gate + dependents' tests."}]},{id:"CORE-SCAN-002",area:"CORE",title:"Member discovery",layer:"bus",status:"confirmed",intent:"Find every place in the code that claims membership of a capability, by scanning for tags.",contract:["`scan_members` walks a code root and, in every source file with a known extension, finds the inline tags.","`scan_members` returns `cap_id -> [(role, relative_file, line), ...]`.","A role is one of `implements`, `generated-from`, `validated-against` and `tested-by`.","A tag ID matches `[A-Z][A-Z0-9]*(-[A-Z0-9]+)+`.","A left-boundary guard prevents a substring match such as `reimplements:` or `x-implements:` being read as a real tag.","The same `(role, ID)` appearing twice on one line is recorded once.","File paths are reported repo-root-relative, with POSIX separators.","A single tag may bind several requirements through a comma-separated id list, written `role: <ID>, <ID>, ...`.","Each id in that list is recorded as a member of the same `(role, file, line)`.","A whole-system doc generated from many requirements (`generated-from: A, B, C`) is therefore a member of each, and drifts when ANY of them changes.","`.git`, `node_modules`, `__pycache__` and the SSOT `requirements/` directory are skipped.","The SSOT directory is matched by realpath, so a source package merely named `requirements/` is still scanned.","Paths matching `.reqmapignore` are excluded.","An unreadable file is skipped without aborting the scan.","`scan_all` returns the members, the per-criterion coverage and the verification levels from a single walk, and each result equals what the three separate scanners return."],acc:["A file containing `# implements: <ID>` produces a member `(implements, file, line)` under `<ID>`.","Excluded directories are not scanned; member paths are POSIX-relative.","An unreadable file is skipped without aborting the scan."],impl:["`scan_members`, `_prune_dirs`, `load_ignore`, `TAG_RE` in `reqmap.py`."],members:[{role:"implements",loc:"scripts/reqmap.py:144-181"},{role:"tested-by",loc:"scripts/test_reqmap.py:146"}],deps:[],usedBy:["REQ-CANDIDATES-009","REQ-CHECK-006","REQ-EXTRACT-008","REQ-MAP-007","REQ-SCAN-005"],risks:[{signal:"blast-radius",advice:"High fan-in — many capabilities depend on this. Treat it as shared foundation (bus)."}]},{id:"CORE-DRIFT-003",area:"CORE",title:"Contract hashing & lock",layer:"bus",status:"confirmed",intent:"Detect when a requirement's binding contract changes, so stale code can be re-checked.",contract:["`binding_hash` computes a stable 12-character hex content hash over only the normative sections of a requirement body.","The normative sections are the `Contract` and `Acceptance` headings, plus the legacy `Input`/`Output`/`Acceptance` headings kept for back-compat.","Rationale, notes, verify-intent, links and the member list stay outside the hash, so they may change without tripping drift.","The hash is deterministic for identical normative content.","`load_lock` and `save_lock` read and write the per-id hash baseline at `requirements/_reqlock.json`.","A missing, empty or unparseable lock loads as an empty mapping, never a crash.","`save_lock` creates the requirements directory if it is absent.","`save_lock` writes sorted, indented JSON, so the lock file is diff-stable."],acc:["Editing only the Description/Notes section does not change the hash.","Editing the Contract section changes the hash.","`load_lock` on a missing or corrupt lock file returns an empty dict (no crash)."],impl:["`binding_hash`, `lock_path`, `load_lock`, `save_lock` in `reqmap.py`."],members:[{role:"implements",loc:"scripts/reqmap.py:209-240"},{role:"tested-by",loc:"scripts/test_reqmap.py:103-116"}],deps:[],usedBy:["REQ-CHECK-006"],risks:[{signal:"drift",advice:"Lock hash differs from current contract. Re-check the named members, then `check --update-lock`."}],drift:!0},{id:"REQ-CHECK-006",area:"REQ",title:"The gate",layer:"feature",status:"confirmed",intent:"Fail the build when code and requirements have fallen out of sync.",contract:["`gate` reports an `ERROR` and exits non-zero for every condition in this group.","A dangling tag — a code tag referencing a capability no requirement defines — is such a condition.","An invalid `status` or an invalid `layer` is such a condition.","A `depends_on` pointing at a missing id is such a condition.","An enforced requirement with no `implements:` member is such a condition.","A requirement is enforced when its status is `in-progress`, `implemented` or `confirmed`.","A `layer: need` requirement is exempt from that `implements:` rule — see [[REQ-TRACE-020]].","`gate` reports drift as a `WARN`, never an error: a `confirmed` requirement whose binding hash differs from the lock.","The drift warning names the member `file:line` locations to re-check.","A `confirmed` requirement with no `tested-by:` member is a `WARN`.","A requirement carrying a `test_exempt: <reason>` o e clauses below it: a bold-only line written flush left. A label is a heading, not a clause, and never folds into the clause above.","Position decides a label, not the bold markers alone. An indented wrapped line folds even when it opens and closes on bold spans, so a two-part clause keeps both halves.","`_map.md` contains exactly 4 Mermaid code blocks: System Map, Req→Code, Dependencies and Risk.","Each of those 4 blocks carries a legend.","A node's area is its `area:` field, or its id prefix when that field is absent.","The System Map groups nodes into per-area subgraphs, and collapses a single-node area into a `misc` box.","The System Map omits a `depends_on` edge whose target is a bus node or a high-fan-in hub.","The Dependency Map is area-level: one node per area, carrying a capability count.","The Dependency Map draws an edge A→B when some capability in A depends on one in B. Per-capability hub edges are not drawn.","Req→Code colors an enforced-but-unlinked requirement red, and a baseline or draft not-yet-linked one muted grey.","Req→Code collapses multiple members in one file to a min–max line range.","The Risk diagram shows only requirements with at least one risk signal (confirmed with zero members; `draft`/`baseline`; ≥3 dependents).","The Risk diagram pairs each of them with a scripted recommendation.","A `draft`'s open verify-intent question is suppressed, subsumed by its `unreviewed` signal, so a draft is not double-flagged.","That dedup lives in `_risk_signals`, shared with the `next` worklist.","All requirement-derived text is JSON-encoded in `_map.json`, which neutralizes any hostile id, title or body by construction. There is no markup context to break out of.","The self-contained HTML viewer ([[REQ-VIEWER-007]]) and the GitHub Pages publish+gate ([[REQ-PAGES-021]]) are separate capabilities. They consume this map's `_map.json` and `_map.html`."],acc:["The generated files contain one node per requirement and one edge per `depends_on`.","`_map.md` contains 4 Mermaid code blocks, each with a legend.","`_map.json` parses to `{engine_version, nodes, edges}` with one node per requirement."],impl:["`cmd_map`, `render_html`, `render_md`, the `_mermaid_*` generators in `reqmap.py`."],members:[{role:"implements",loc:"scripts/reqmap.py:1033-1948"},{role:"tested-by",loc:"scripts/test_reqmap.py:237-1069"}],deps:["CORE-PARSE-001","CORE-SCAN-002"],usedBy:["REQ-INIT-012","REQ-NEXT-013"],risks:[]},{id:"REQ-NEW-004",area:"REQ",title:"Scaffold a requirement",layer:"feature",status:"confirmed",intent:"Create a new requirement file from the template, so every capability starts in the same shape.",contract:["Given a capability id, `new` writes `requirements/<ID>.md`, stamped from the scaffold with the placeholder `AREA-NAME-NNN` replaced by that id.","`new` creates the requirements directory if it is absent.","The scaffold is the engine's built-in template.","An on-disk `templates/requirement.md`, when present, overrides the built-in template.","`new` refuses to overwrite an existing file. It exits non-zero and writes nothing.",'The emitted Contract section opens with "Every line in this section is binding.", so the author writes clauses in present tense without a `shall` or `must` on each line.',"The scaffold's guidance names the authoring rules the linter enforces, so a file written from it starts clean."],acc:["`new FOO-NEW-099` on an empty registry creates `requirements/FOO-NEW-099.md` with that id.","Running `new` for an id that already exists exits non-zero and writes nothing."],impl:["`cmd_new`, `REQUIREMENT_TEMPLATE` in `reqmap.py`."],members:[{role:"implements",loc:"scripts/reqmap.py:425"},{role:"tested-by",loc:"scripts/test_reqmap.py:463"}],deps:["CORE-PARSE-001"],usedBy:[],risks:[]},{id:"REQ-PROMOTE-011",area:"REQ",title:"Promote",layer:"feature",status:"confirmed",intent:"One command to perform the human-validation step — flip a reviewed requirement to confirmed.",contract:["`confirm <ID>` sets the requirement's `statu

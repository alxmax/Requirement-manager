ract:["`gate` reports an `ERROR` and exits non-zero for a dangling tag, an invalid status/layer/form/level, a missing `depends_on` target, or an enforced requirement with no `implements:` member. [[REQ-CHECK-828]] details the behaviour.","`gate` warns (not errors) on contract drift against the lock or a confirmed requirement with no `tested-by:` link; `--strict` promotes these to errors. [[REQ-CHECK-829]] details the behaviour.","`gate` warns, without affecting the exit code, on a confirmed requirement missing its `## Description` or `## Cases` section. [[REQ-CHECK-1040]] details the behaviour.","`gate` warns on a malformed `milestone:` value, and on a corrupt or git-untracked lock file; a corrupt lock is an error under `--strict`. [[REQ-CHECK-830]] details the behaviour.","`gate` counts legacy-schema requirements in its summary and warns, without affecting the exit code, on a `depends_on` cycle; under `--since` it reads the level warnings' facts from the whole tree. [[REQ-CHECK-831]] details the behaviour.","`gate` prints the open verify-intent finding count and a summary of requirements, members, errors and warnings; neither affects the exit code. [[REQ-CHECK-832]] details the behaviour.","With `--update-lock` — always passed by `sync` — `gate` writes the current binding hashes to `requirements/_reqlock.json`; the bare `gate` verb is otherwise report-only. [[REQ-CHECK-833]] details the behaviour.","`gate` warns on a Description link `[[ID]]` whose target no requirement defines, without affecting the exit code. [[REQ-CHECK-1035]] details the behaviour.","A bare `gate` runs only the rules that say a link, the drift baseline or the committed map is broken, and prints readability errors only; `gate --full` runs everything. [[REQ-CHECK-1036]] details the behaviour."],acc:["A tag referencing a non-existent capability produces an `ERROR` and exit 1.","A `confirmed` requirement with no `implements` member produces an `ERROR`.","A drifted contract produces a `WARN` (not an error) naming the member locations."],impl:["`cmd_check`, `warn_if_stale` in `reqmap.py`."],members:[{role:"implements",loc:"scripts/reqmap.py:247-296"},{role:"tested-by",loc:"scripts/test_reqmap.py:93-958"}],deps:["ARCH-PARSE-001","ARCH-SCAN-002","ARCH-DRIFT-003"],usedBy:["ARCH-INIT-012"],risks:[]},{id:"ARCH-EXTRACT-008",area:"REQ",title:"Legacy extraction",layer:"feature",status:"confirmed",intent:"Bootstrap a registry on a brownfield codebase by proposing draft requirements from untagged code.",contract:["`draft` walks every untagged scannable code file, skipping tagged and `.reqmapignore`-matched ones. [[REQ-EXTRACT-849]] details the behaviour.","`draft` proposes one `requirements/DRAFT-*.md` per remaining file, marked `status: draft` with a TODO contract. [[REQ-EXTRACT-850]] details the behaviour.","`draft` assigns a cheap risk score from `TODO`/`FIXME`/`HACK`/`XXX` markers, suppressions and file size, and never overwrites an existing draft. [[REQ-EXTRACT-851]] details the behaviour.","Extraction drafts all three specification rungs and marks every one it invented, so a corpus starts as a pyramid the author corrects rather than a flat list. [[REQ-EXTRACT-981]] details the behaviour.","Extraction links each source file to the draft it produced by writing that file’s membership tag into it, reversibly, so a stub never ships with zero members. [[REQ-INITTAG-1008]]"],acc:["An untagged `.py`/`.js`/`.ts`/`.c`/`.cpp` file yields one `DRAFT-*` draft.","A file matching a `.reqmapignore` pattern is skipped (no draft proposed).","A file containing `TODO`/`FIXME` scores higher risk and is flagged `REVIEW`."],impl:["`cmd_extract`, `_draft_id`, `_risk`, `classify_prose` in `reqmap.py`."],members:[{role:"implements",loc:"scripts/reqmap.py:495-641"},{role:"tested-by",loc:"scripts/test_reqmap.py:194-429"}],deps:["ARCH-SCAN-002"],usedBy:["ARCH-INIT-012"],risks:[]},{id:"ARCH-CANDIDATES-009",area:"REQ",title:"Capability candidates",layer:"feature",status:"confirmed",intent:"Stage 1 of AI extraction: emit a deterministic capability plan from legacy code, writing no requirement files.",contract:["`draft --plan` emits a single JSON object, to stdout or to `--out PATH`, shaped `{engine_version, bus[], candidates[]}`, and writes no `.md` files. [[REQ-CANDIDATES-826]]","Each candidate carries `{suggested_id, suggested_layer, files[], docstrings{}, signatures[], imports[], depends_on[], tested_by[], importer_count, existing_req, loc, split_candidate, is_test}`. [[REQ-CANDIDATES-827]]","The plan and the write path read ONE definition of an already-covered file, so a file the write path would skip is never reported as new. [[REQ-PLANTAGGED-1005]]","The plan states the rung of every candidate it would draft and the upper rungs the same run would mint, so the pyramid is visible before anything is written. [[REQ-PLANLEVEL-1006]]","Each candidate the write path would draft also states the id that write path will mint for it, without either id being renamed. [[REQ-PLANDRAFTID-1010]]"],acc:["Running `candidates` writes zero `.md` files and emits valid JSON.","An import of a local module yields a `depends_on` edge to that module's candidate.","A module imported by ≥ the bus threshold is suggested as `bus`."],impl:["`cmd_candidates`, `_py_facts`, `_js_facts`, `_load_capmap` in `reqmap.py`."],members:[{role:"implements",loc:"scripts/reqmap.py:658-805"},{role:"tested-by",loc:"scripts/test_reqmap.py:521-908"}],deps:["ARCH-SCAN-002"],usedBy:[],risks:[]},{id:"ARCH-FINDINGS-010",area:"REQ",title:"Open-findings report",layer:"feature",status:"confirmed",intent:`Roll up every requirement's open "verify intent" questions into one reviewable _findings.md.`,contract:["`sync` collects the bullet items under each requirement's `## Verify intent` section. [[REQ-FINDINGS-853]]","In raw mode, `sync` groups the collected findings by requirement and writes the raw report. [[REQ-FINDINGS-854]]","When a `_findings_triage.json` sidecar exists and raw mode is off, `sync` renders a classified view ordered by severity. [[REQ-FINDINGS-855]]","`sync` is deterministic and stdlib-only; `map` and `gate` fold its output in without ever classifying a finding themselves. [[REQ-FINDINGS-856]]"],gwt:`AC-1

lemented` requirement's binding content no longer matches the lock, it writes `draft` into that requirement and advances the baseline. [[REQ-PROMOTE-974]] details the behaviour.",'**`--accept-drift` is the escape hatch, and it is a human saying so:** it keeps the status and advances the baseline. It exists because "I edited it and it is still valid" is a real answer — it just has to be given, not assumed.',"**The invariant that a confirmed requirement points at code is enforced by the gate, not by a command.** `RM006` is an error, so a status written by hand with no `implements:` member fails at the next run."],gwt:`CASE-1

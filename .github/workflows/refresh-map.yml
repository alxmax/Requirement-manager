name: refresh-map
on:
  push:
    branches: [fix/init-full-pyramid]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate committed map
        run: python plugin/scripts/reqmap.py sync --code . --root plugin
      - name: Commit if stale
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture.html \
                  plugin/requirements/_map.md \
                  plugin/requirements/_map.json \
                  plugin/requirements/_memberlock.json
          if git diff --cached --quiet; then
            echo "map already fresh"
            exit 0
          fi
          git commit -m "sync map after MAP_ENGINE_VERSION 2026-09-13"
          git push

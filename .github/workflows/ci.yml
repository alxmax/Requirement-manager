name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege default for every job. The gate/test job needs nothing more
# than read access to the tree; the deploy-map job opts into the extra scopes it
# needs at the job level below (defense in depth — scopes never leak between jobs).
permissions:
  contents: read

# Action refs are pinned to a full 40-hex commit SHA (not a mutable @vN tag): a
# compromised tag re-point cannot silently execute in our runs. The trailing
# comment names the human-readable version each SHA corresponds to. `.github/
# dependabot.yml` (github-actions, weekly) keeps these pins current — pins
# without that refresh would rot, so the two ship together.

jobs:
  gate-and-tests:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 (full history) so the changelog-entry check below can
      # resolve HEAD~1 — the previous commit's plugin.json version — on both
      # push and pull_request events.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.x"
      # The engine is stdlib-only — no dependencies to install.
      - name: Manifest version coherence
        run: python scripts/check_versions.py
      - name: Version-gate tests
        run: python -X utf8 scripts/test_check_versions.py
      # A plugin.json version bump must ship with a matching CHANGELOG.md
      # entry, or it merges silently undocumented (as v2.9.0 once did).
      # Stated decision (Consilium dialectic, run
      # 2026-07-03_1638_requirement-manager-changelog-tagging-ci, Skeptic
      # goal_fit objection): ship this lighter-form release record now
      # (a job-summary annotation, no new permissions); real git-tag/GitHub-
      # Release automation is deferred to a future, separately-tracked
      # decision — not silently omitted.
      - name: Version bump has a matching CHANGELOG entry
        run: |
          if git rev-parse HEAD~1 >/dev/null 2>&1 && ! git diff --quiet HEAD~1 -- plugin/.claude-plugin/plugin.json; then
            VERSION=$(python -c "import json; print(json.load(open('plugin/.claude-plugin/plugin.json'))['version'])")
            if ! grep -qF "\`v$VERSION\`" CHANGELOG.md; then
              echo "::error::plugin.json version bumped to $VERSION but CHANGELOG.md has no matching 'v$VERSION' heading — add one before merging."
              exit 1
            fi
            {
              echo "### Release"
              echo "plugin semver: **v$VERSION** — see \`CHANGELOG.md\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      # This repo runs the gate directly (not via check/action.yml) to avoid
      # depending on its own unpublished action.
      - name: Requirement drift gate
        working-directory: plugin
        run: python -X utf8 scripts/reqmap.py gate
      - name: Map freshness
        working-directory: plugin
        run: python -X utf8 scripts/reqmap.py map --check
      - name: Engine regression tests
        working-directory: plugin/scripts
        run: python -X utf8 -m unittest test_reqmap -v
      - name: Excalidraw builder + example diagrams
        working-directory: plugin/skills/excalidraw-diagram/scripts
        run: |
          python -X utf8 excalidraw_builder.py
          python -X utf8 -m unittest test_excalidraw -v

  # Publish the requirement-map site (the committed docs/ Pages root: map.html,
  # the Excalidraw architecture diagrams, .nojekyll, index redirect) to GitHub
  # Pages — authenticated with the workflow's short-lived OIDC id-token, NO
  # stored secret or PAT. This is the repo dogfooding its own output AND a real
  # secure-design demo: per-job least-privilege + OIDC instead of long-lived
  # credentials. Runs only after the gate passes (so docs/ is drift-checked) and
  # only on pushes to main (never on PRs / forks).
  deploy-map:
    needs: gate-and-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # GitHub Pages allows only one in-flight deployment; serialize so that two
    # close-together pushes to main queue instead of one failing with
    # "due to in progress deployment". cancel-in-progress: false lets an
    # already-running deploy finish rather than abort mid-publish.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read   # read the tree
      pages: write     # publish to Pages
      id-token: write  # mint the OIDC id-token consumed by deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # Refuse to publish a blank/stub site: a green pipeline that serves an empty
      # map at the live URL is the worst failure mode for the reader who clicks it.
      - name: Validate published map is non-empty
        run: |
          test -s docs/map.html || { echo "::error::docs/map.html missing or empty"; exit 1; }
          bytes=$(wc -c < docs/map.html)
          echo "docs/map.html is $bytes bytes"
          [ "$bytes" -ge 10000 ] || { echo "::error::docs/map.html is only $bytes bytes — refusing to publish a blank map"; exit 1; }
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  # Cut a GitHub release when plugin.json's version has no tag yet. plugin.json is
  # the single source of truth (check_versions.py enforces it across the three
  # manifests), so the release tracks the version consumers actually install via
  # /plugin update — tags can no longer drift behind it. This is the git-tag /
  # GitHub-Release automation the changelog-tagging decision deferred (see the
  # gate-and-tests comment above). Runs only after the gate passes and only on
  # pushes to main. Idempotent: a push that does not bump the version finds the
  # tag already present and exits 0 without creating anything — so only a
  # version-bumping merge produces a release. Notes come from the matching
  # CHANGELOG.md section (scripts/changelog_notes.py), the same heading the
  # version-bump gate already requires, so notes never drift from the changelog.
  release:
    needs: gate-and-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the tag + GitHub release
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.x"
      - name: Release plugin.json version if untagged
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python -c "import json; print(json.load(open('plugin/.claude-plugin/plugin.json'))['version'])")
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists — nothing to cut."
            exit 0
          fi
          python -X utf8 scripts/changelog_notes.py "$VERSION" > RELEASE_NOTES.md
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file RELEASE_NOTES.md
          echo "cut release $TAG" >> "$GITHUB_STEP_SUMMARY"

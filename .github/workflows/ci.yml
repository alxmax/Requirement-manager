name: ci
# implements: REQ-SELFGATE-039
# implements: REQ-PYFLOOR-040
# implements: REQ-REPRO-041

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege default for every job. The gate/test job needs nothing more
# than read access to the tree; the deploy-map job opts into the extra scopes it
# needs at the job level below (defense in depth — scopes never leak between jobs).
permissions:
  contents: read

# Action refs are pinned to a full 40-hex commit SHA (not a mutable @vN tag): a
# compromised tag re-point cannot silently execute in our runs. The trailing
# comment names the human-readable version each SHA corresponds to. `.github/
# dependabot.yml` (github-actions, weekly) keeps these pins current — pins
# without that refresh would rot, so the two ship together.

jobs:
  gate-and-tests:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 (full history) so the changelog-entry check below can
      # resolve HEAD~1 — the previous commit's plugin.json version — on both
      # push and pull_request events.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      # The engine is stdlib-only — no dependencies to install.
      - name: Manifest version coherence
        run: python scripts/check_versions.py
      - name: Version-gate tests
        run: python -X utf8 scripts/test_check_versions.py
      # The published action's own probe: it runs in CONSUMER repos, never here, so this
      # suite is the only thing that exercises it before it ships.
      - name: Engine-staleness probe tests
        run: python -X utf8 scripts/test_engine_staleness.py
      - name: Release-notes extraction tests
        working-directory: scripts
        run: python -X utf8 test_changelog_notes.py
      # A plugin.json version bump must ship with a matching CHANGELOG.md
      # entry, or it merges silently undocumented (as v2.9.0 once did).
      # Stated decision (Consilium dialectic, run
      # 2026-07-03_1638_requirement-manager-changelog-tagging-ci, Skeptic
      # goal_fit objection): ship this lighter-form release record now
      # (a job-summary annotation, no new permissions); real git-tag/GitHub-
      # Release automation is deferred to a future, separately-tracked
      # decision — not silently omitted.
      - name: Version bump has a matching CHANGELOG entry
        run: |
          if git rev-parse HEAD~1 >/dev/null 2>&1 && ! git diff --quiet HEAD~1 -- plugin/.claude-plugin/plugin.json; then
            VERSION=$(python -c "import json; print(json.load(open('plugin/.claude-plugin/plugin.json'))['version'])")
            if ! grep -qF "\`v$VERSION\`" CHANGELOG.md; then
              echo "::error::plugin.json version bumped to $VERSION but CHANGELOG.md has no matching 'v$VERSION' heading — add one before merging."
              exit 1
            fi
            {
              echo "### Release"
              echo "plugin semver: **v$VERSION** — see \`CHANGELOG.md\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      # This repo runs the gate directly (not via check/action.yml) to avoid
      # depending on its own unpublished action.
      - name: Requirement drift gate
        working-directory: plugin
        run: python -X utf8 scripts/reqmap.py gate --code ..
      # Clarity rules (SKILL.md "Audience & writing level") made blocking. Without
      # this step `lint` was mechanised but never executed, so 28 readability
      # warnings accumulated unseen. --strict fails on error-severity findings
      # (missing Contract/Acceptance section) and promotes ac-count-high +
      # over-scoped to errors; a requirement that is genuinely one behaviour opts
      # out per check via `lint_exempt:` with the reason recorded in its Notes.
      - name: Requirement clarity lint
        working-directory: plugin
        run: python -X utf8 scripts/reqmap.py lint --strict --code ..
      - name: Map freshness
        working-directory: plugin
        run: python -X utf8 scripts/reqmap.py map --check --code ..
      - name: Engine regression tests
        working-directory: plugin/scripts
        run: python -X utf8 -m unittest test_reqmap -v
      - name: Excalidraw builder + example diagrams
        working-directory: plugin/skills/excalidraw-diagram/scripts
        run: |
          python -X utf8 excalidraw_builder.py
          python -X utf8 -m unittest test_excalidraw -v

  # Portability matrix. The engine claims "stdlib only, runs anywhere with Python",
  # and until now one job on ubuntu + `python-version: 3.x` was the whole evidence for
  # it — so the floor was accidental (3.7, untested) and the `-X utf8` convention that
  # exists specifically FOR Windows had never run on Windows in CI. This job is the
  # proof: the oldest entry equals reqmap.py's MIN_PYTHON (REQ-PYFLOOR-040 AC-3 asserts
  # they stay equal), and both OSes run every suite. Deliberately separate from
  # gate-and-tests: the gate is a single authoritative verdict about THIS repo's
  # requirement corpus, not a per-interpreter one, and running it six times would
  # just be six identical answers.
  tests:
    name: tests (py${{ matrix.python }} on ${{ matrix.os }})
    strategy:
      # One red cell must not hide the others: knowing a failure is "3.9 everywhere"
      # vs "windows everywhere" is the whole diagnostic value of a matrix.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0        # test_cross_tool seeds a repo and shells out to git
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      # No `shell:` overrides below — each step is a single `python` invocation, so the
      # runner's default shell (bash on Linux, pwsh on Windows) never sees shell syntax.
      - name: Engine regression tests
        working-directory: plugin/scripts
        run: python -X utf8 -m unittest test_reqmap -v
      - name: Version-gate tests
        run: python -X utf8 scripts/test_check_versions.py
      - name: Engine-staleness probe tests
        run: python -X utf8 scripts/test_engine_staleness.py
      - name: Release-notes extraction tests
        working-directory: scripts
        run: python -X utf8 test_changelog_notes.py
      - name: Cross-tool falsification (seed engine -> sync -> gate -> map)
        run: python -X utf8 scripts/test_cross_tool.py
      - name: Excalidraw builder smoke
        working-directory: plugin/skills/excalidraw-diagram/scripts
        run: python -X utf8 excalidraw_builder.py
      - name: Excalidraw tests
        working-directory: plugin/skills/excalidraw-diagram/scripts
        run: python -X utf8 -m unittest test_excalidraw -v

  # Committed build artifacts, re-derived and compared. Two files in this repo are
  # BUILD OUTPUT that is nonetheless committed, because the whole point is that a
  # consumer gets them without a toolchain: plugin/scripts/_map_viewer.html (217KB,
  # the Vite single-file build the stdlib engine injects data into) and
  # docs/full_architecture.html (99KB, an Excalidraw poster). Nothing checked either
  # against its source, so a change to app/ or to the generator could ship a viewer
  # that no longer matched the code it was built from - and the repo would still be
  # green. Both builds are byte-reproducible today; this job is what keeps them that
  # way, and turns "regenerable" from a claim in diagrams/README.md into a check.
  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - name: Install viewer dependencies
        working-directory: app
        run: npm ci
      # The app's ONLY automated check, and until now it never ran here — so a render
      # throw or a broken i18n boundary could reach main with every job green. It was
      # left out because the smoke reads app/public/data.json, which is gitignored: a
      # fresh checkout has no fixture. `npm run sync` builds one from the COMMITTED
      # plugin/requirements/_map.json, so the smoke runs against this repo's real
      # registry rather than a stand-in. Placed before the build: a render throw should
      # fail in seconds, not after a Vite build.
      - name: Viewer SSR smoke
        working-directory: app
        run: npm run sync && npm run smoke
      - name: Rebuild the vendored viewer
        working-directory: app
        run: npm run build:viewer
      # The build writes straight over the committed copy, so the diff IS the check.
      - name: Vendored viewer matches app/
        run: |
          if ! git diff --exit-code -- plugin/scripts/_map_viewer.html; then
            echo "::error::plugin/scripts/_map_viewer.html is stale - rebuild it with \`cd app && npm run build:viewer\` and commit the result (see app/CLAUDE.md)."
            exit 1
          fi
      # The diagram generator writes a .excalidraw next to its .html, and docs/*.excalidraw
      # is hard-blocked by .gitignore, so build into a temp dir and compare instead of
      # regenerating in place.
      - name: Published architecture diagram matches its generator
        run: |
          out=$(mktemp -d)
          python -X utf8 plugin/skills/excalidraw-diagram/examples/make_full_architecture.py "$out"
          if ! cmp -s "$out/full_architecture.html" docs/full_architecture.html; then
            echo "::error::docs/full_architecture.html no longer matches make_full_architecture.py - regenerate it and commit the result."
            exit 1
          fi
          echo "docs/full_architecture.html matches its generator"

  # Two numbers about the engine that nothing published before: how much of it the
  # suite actually executes, and what a linter makes of it. Both land in the run's job
  # summary rather than scrolling past in a log.
  #
  # Only ONE part can fail: `E9,F` - syntax errors and undefined names, the rules that
  # find real defects rather than style. That subset is clean today, so this job cannot
  # newly redden a green build, and it stays meaningful: a check that can never fail is
  # documentation. Everything else ruff reports (f-string modernisation, blind excepts,
  # subprocess-without-check) is published as advisory. Several of those are deliberate
  # in this engine - `except Exception: return None` IS the fail-open contract in half a
  # dozen places - so mass-fixing them would be a style rewrite disguised as a lint fix.
  #
  # No coverage floor yet: publish the number first, argue about a threshold once there
  # is a series to argue from. Deliberately NOT in `release`'s needs - the authoritative
  # verdicts on this repo stay dependency-free, and this is the one job that installs
  # from PyPI. Both tools are pinned so a new release cannot turn the build red overnight.
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - name: Install pinned tooling
        run: python -m pip install --disable-pip-version-check --quiet ruff==0.16.4 coverage==7.15.4
      - name: Ruff - bug-class rules
        working-directory: plugin/scripts
        run: python -m ruff check --select E9,F reqmap.py
      - name: Engine coverage + lint report
        working-directory: plugin/scripts
        run: |
          python -X utf8 -m coverage run --source=. --omit="test_*.py" test_reqmap.py > /dev/null
          python -m coverage json -o coverage.json --quiet
          {
            echo "## Engine quality"
            echo
            python - <<'PY'
          import json
          t = json.load(open("coverage.json"))["totals"]
          covered = t["num_statements"] - t["missing_lines"]
          print("**Coverage** - `test_reqmap.py` over `reqmap.py`: **{:.0f}%** "
                "({} of {} statements executed).".format(
                    t["percent_covered"], covered, t["num_statements"]))
          PY
            echo
            echo "**Ruff** - \`E9,F\` (syntax errors, undefined names) is the failing subset above and is clean. The rest is advisory:"
            echo
            echo '```'
            python -m ruff check --statistics --exit-zero reqmap.py
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f coverage.json .coverage

  # Publish the requirement-map site (the committed docs/ Pages root: map.html,
  # the Excalidraw architecture diagrams, .nojekyll, index redirect) to GitHub
  # Pages — authenticated with the workflow's short-lived OIDC id-token, NO
  # stored secret or PAT. This is the repo dogfooding its own output AND a real
  # secure-design demo: per-job least-privilege + OIDC instead of long-lived
  # credentials. Runs only after the gate passes (so docs/ is drift-checked) and
  # only on pushes to main (never on PRs / forks).
  deploy-map:
    needs: gate-and-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # GitHub Pages allows only one in-flight deployment; serialize so that two
    # close-together pushes to main queue instead of one failing with
    # "due to in progress deployment". cancel-in-progress: false lets an
    # already-running deploy finish rather than abort mid-publish.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read   # read the tree
      pages: write     # publish to Pages
      id-token: write  # mint the OIDC id-token consumed by deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # Refuse to publish a blank/stub site: a green pipeline that serves an empty
      # map at the live URL is the worst failure mode for the reader who clicks it.
      - name: Validate published map is non-empty
        run: |
          test -s docs/map.html || { echo "::error::docs/map.html missing or empty"; exit 1; }
          bytes=$(wc -c < docs/map.html)
          echo "docs/map.html is $bytes bytes"
          [ "$bytes" -ge 10000 ] || { echo "::error::docs/map.html is only $bytes bytes — refusing to publish a blank map"; exit 1; }
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  # Cut a GitHub release when plugin.json's version has no tag yet. plugin.json is
  # the single source of truth (check_versions.py enforces it across the three
  # manifests), so the release tracks the version consumers actually install via
  # /plugin update — tags can no longer drift behind it. This is the git-tag /
  # GitHub-Release automation the changelog-tagging decision deferred (see the
  # gate-and-tests comment above). Runs only after the gate passes and only on
  # pushes to main. Idempotent: a push that does not bump the version finds the
  # tag already present and exits 0 without creating anything — so only a
  # version-bumping merge produces a release. Notes come from the matching
  # CHANGELOG.md section (scripts/changelog_notes.py), the same heading the
  # version-bump gate already requires, so notes never drift from the changelog.
  release:
    # Also gated on the matrix and on artifact reproducibility: a version that fails
    # on Windows, on the declared floor, or ships a viewer that no longer matches
    # app/ must not become a tag consumers install. deploy-map stays on the gate
    # alone — it republishes docs/, which the gate already drift-checks.
    needs: [gate-and-tests, tests, artifacts]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the tag + GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - name: Release plugin.json version if untagged
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python -c "import json; print(json.load(open('plugin/.claude-plugin/plugin.json'))['version'])")
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists — nothing to cut."
            exit 0
          fi
          python -X utf8 scripts/changelog_notes.py "$VERSION" > RELEASE_NOTES.md
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file RELEASE_NOTES.md
          echo "cut release $TAG" >> "$GITHUB_STEP_SUMMARY"

      # The published Action (check/action.yml) is consumed as `.../check@vN`, a MAJOR
      # ALIAS that has to be re-pointed at the newest release or it rots: `@v1` sat 193
      # commits behind main for two months while the README kept advertising it, because
      # moving it was a manual step nobody was reminded to take. So: derive the major
      # from the `uses:` reference the docs themselves publish (check_versions.py asserts
      # action.yml / README.md / CLAUDE.md all name the same one) and force-move it onto
      # the commit the CURRENT plugin.json version is tagged at. Deliberately outside the
      # "already released, exit 0" shortcut above and re-asserted on every push to main:
      # re-pointing the alias at where it already is is a no-op push, so a run that failed
      # halfway (or a tag moved by hand) self-heals on the next push instead of staying
      # silently wrong until someone reads the README and notices.
      - name: Move the action's major-alias tag onto the released commit
        run: |
          ALIAS=$(grep -oE 'requirement-manager/check@v[0-9]+' check/action.yml | head -n1 | sed 's/.*@//')
          case "$ALIAS" in
            v[0-9]*) ;;
            *) echo "::error::no 'requirement-manager/check@vN' reference in check/action.yml - cannot derive the alias tag"; exit 1 ;;
          esac
          VERSION=$(python -c "import json; print(json.load(open('plugin/.claude-plugin/plugin.json'))['version'])")
          TAG="v$VERSION"
          # Fetch it explicitly: the tag may have been created remotely by the step above,
          # in which case this checkout has never seen it. rev-list peels an annotated tag
          # to its commit, so the alias always names a commit whatever the tag's type.
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          TARGET=$(git rev-list -n 1 "$TAG")
          git tag -f "$ALIAS" "$TARGET"
          git push --force origin "refs/tags/$ALIAS"
          echo "action alias $ALIAS -> $TAG ($TARGET)" >> "$GITHUB_STEP_SUMMARY"

# Requirement-manager drift gate — published GitHub Action.
#
# Placed in check/ on purpose: GitHub resolves `owner/repo/<dir>@ref` to
# `<dir>/action.yml`, so this file is consumed as:
#
#     uses: alxmax/requirement-manager/check@v1
#
# Usage (in a consumer repo that has vendored scripts/reqmap.py per the skill setup):
#
#     name: reqmap gate
#     on: [push, pull_request]
#     permissions:
#       contents: read            # least privilege — the gate only reads the tree
#     jobs:
#       check:
#         runs-on: ubuntu-latest
#         steps:
#           - uses: actions/checkout@v4
#           - uses: alxmax/requirement-manager/check@v1
#
# Versioning: `@v1` is the git tag the maintainer pushes; it pins the engine to the
# repo content at that tag. Pin to `@v1` (moves with backward-compatible fixes) or to
# an exact tag / commit SHA for full reproducibility. The tag is independent of the
# plugin semver and of reqmap.py's MAP_ENGINE_VERSION.
#
# Scope note: reqmap's vendored-copy staleness warning (warn_if_stale) is gated on the
# CLAUDE_PLUGIN_ROOT env var, which is unset in CI — so it is silent and exit-neutral
# here by design. This action enforces the gate proper (link sync + drift + depends_on)
# and, by default, map freshness (`map --check`) so a stale/uncommitted map can't merge.
#
# Fork-PR safety: keep `permissions: contents: read` in the caller workflow. The gate
# needs no secrets and no write scope; do not grant them.

name: 'Requirement drift gate'
description: 'Run the requirement-manager reqmap gate (link sync + drift + depends_on) plus map freshness on every push / PR.'
branding:
  icon: 'check-circle'
  color: 'green'

inputs:
  reqmap-path:
    description: 'Path to the vendored reqmap.py, relative to working-directory.'
    required: false
    default: 'scripts/reqmap.py'
  working-directory:
    description: 'Directory the gate runs from (where requirements/ lives).'
    required: false
    default: '.'
  python-version:
    description: 'Python to set up for the gate (stdlib-only; any 3.x works).'
    required: false
    default: '3.x'
  freshness:
    description: 'Also run `reqmap.py map --check` so a stale or never-committed map/lock fails the build. Silent in a repo that does not track a map. Set to "false" to disable.'
    required: false
    default: 'true'
  reqmap-repo:
    description: 'owner/name to pin the map regeneration to (sets REQMAP_REPO) — needed ONLY when the committed map is generated for a different slug than this repo (e.g. a private repo that publishes to a public mirror). Leave empty to use the repo''s own git remote.'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    # Pinned to a full commit SHA (not @v5) so a compromised tag re-point cannot
    # execute in any consumer's run. Dependabot (github-actions, weekly) keeps it
    # current — see .github/dependabot.yml.
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: reqmap gate
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      # `gate` is the intent-verb name for the report-only check (v2.0.0+).
      # The engine keeps `check` as a deprecation alias, so a consumer whose workflow
      # calls `check` directly keeps working. This action, however, invokes `gate` —
      # so only move/cut the `@v1` tag onto a v2.0.0+ commit once consumers can be
      # expected to have re-seeded reqmap.py (>=2.0.0). An older vendored engine does
      # not know `gate` and would exit 2.
      run: python -X utf8 "${{ inputs.reqmap-path }}" gate
    - name: reqmap map freshness
      if: ${{ inputs.freshness == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      # Catches a stale or never-committed map/lock — the failure mode that lets member
      # drift accumulate unseen on a fresh checkout. A repo that does not track a map
      # passes silently. REQMAP_REPO is exported ONLY when provided, because an empty
      # value means "emit no repo" to the engine and would falsely report staleness
      # against a committed map that carries a repo slug.
      run: |
        if [ -n "${{ inputs.reqmap-repo }}" ]; then
          export REQMAP_REPO="${{ inputs.reqmap-repo }}"
        fi
        python -X utf8 "${{ inputs.reqmap-path }}" map --check

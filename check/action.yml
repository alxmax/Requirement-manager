# Requirement-manager drift gate — published GitHub Action.
# implements: REQ-SELFGATE-039
#
# Placed in check/ on purpose: GitHub resolves `owner/repo/<dir>@ref` to
# `<dir>/action.yml`, so this file is consumed as:
#
#     uses: alxmax/requirement-manager/check@v2
#
# Usage (in a consumer repo that has vendored scripts/reqmap.py per the skill setup):
#
#     name: reqmap gate
#     on: [push, pull_request]
#     permissions:
#       contents: read            # least privilege — the gate only reads the tree
#     jobs:
#       check:
#         runs-on: ubuntu-latest
#         steps:
#           - uses: actions/checkout@v4
#           - uses: alxmax/requirement-manager/check@v2
#
# Versioning: `@vN` is a MAJOR-ALIAS tag naming the action's interface line, not a
# release. The `uses:` reference above IS its source of truth — there is no separate
# version file to fall out of step with the docs — and `.github/workflows/ci.yml`'s
# release job reads the major from this file and force-moves the tag onto every commit
# it releases, so the alias always resolves to the latest released content on that line
# and cannot silently rot behind the repo again. scripts/check_versions.py asserts this
# file, README.md and CLAUDE.md all name the same major. Pin to `@v2` (moves with backward-compatible fixes) or to an exact
# `vX.Y.Z` tag / commit SHA for full reproducibility. The alias is independent of the
# plugin semver and of reqmap.py's MAP_ENGINE_VERSION.
#
# `@v1` is FROZEN at plugin v2.1.0 content (tag pushed 2026-06-15) and no longer
# moves: existing pins keep working exactly as they did, and get nothing new. The
# major bump to `@v2` is not cosmetic — the `freshness` and `lint` steps below default
# to 'true', so re-pointing `@v1` onto this commit would newly FAIL a consumer build
# that was green (a stale committed map, or a requirement the clarity lint rejects).
# Adding a default-on check to an existing pin is a breaking change for the caller;
# that is what the new major is for.
#
# Scope note: reqmap's vendored-copy staleness warning (warn_if_stale) is gated on the
# CLAUDE_PLUGIN_ROOT env var, which is unset in CI — so it is silent and exit-neutral
# here by design. This action enforces the gate proper (link sync + drift + depends_on)
# and, by default, map freshness (`map --check`) so a stale/uncommitted map can't merge.
#
# `lint` defaults to 'true', like `freshness`. The gate proves the LINKS are real; it says
# nothing about whether the requirement is readable. Shipping the clarity rules switched off
# would recreate the exact failure that motivated them: in this repo `lint` was mechanised
# but never executed anywhere, so 28 findings accumulated unseen until plugin v2.14.0 wired
# it in. A check that must be opted into is documentation, not a check.
#
# The one real compatibility constraint is the VENDORED engine, not the caller: this action
# runs the consumer's own scripts/reqmap.py. `lint` exists since plugin v1.14.0 and the
# `lint_exempt:` escape hatch since v2.3.4 — below that, a repo that trips the lint has no
# way to declare a shape deliberate, so re-seed the engine (or pass `lint: 'false'`) before
# adopting `@v2`.
#
# Fork-PR safety: keep `permissions: contents: read` in the caller workflow. The gate
# needs no secrets and no write scope; do not grant them.

name: 'Requirement drift gate'
description: 'Run the requirement-manager reqmap gate (link sync + drift + depends_on) plus map freshness, and optionally the requirement lint, on every push / PR.'
branding:
  icon: 'check-circle'
  color: 'green'

inputs:
  reqmap-path:
    description: 'Path to the vendored reqmap.py, relative to working-directory.'
    required: false
    default: 'scripts/reqmap.py'
  working-directory:
    description: 'Directory the gate runs from (where requirements/ lives).'
    required: false
    default: '.'
  python-version:
    description: 'Python to set up for the gate (stdlib-only; any 3.x works).'
    required: false
    default: '3.x'
  freshness:
    description: 'Also run `reqmap.py map --check` so a stale or never-committed map/lock fails the build. Silent in a repo that does not track a map. Set to "false" to disable.'
    required: false
    default: 'true'
  lint:
    description: 'Also run `reqmap.py lint --strict` so an unreadable or structurally broken requirement fails the build. Errors only on a confirmed requirement missing its Contract or Acceptance section, plus the strict-promoted structural checks; style findings stay advisory. Needs a vendored engine >= 2.3.4 (the release that added the `lint_exempt:` escape hatch). Set to "false" to disable.'
    required: false
    default: 'true'
  reqmap-repo:
    description: 'owner/name to pin the map regeneration to (sets REQMAP_REPO) — needed ONLY when the committed map is generated for a different slug than this repo (e.g. a private repo that publishes to a public mirror). Leave empty to use the repo''s own git remote.'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    # Pinned to a full commit SHA (not @v5) so a compromised tag re-point cannot
    # execute in any consumer's run. Dependabot (github-actions, weekly) keeps it
    # current — see .github/dependabot.yml.
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}
    - name: reqmap gate
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      # `gate` is the intent-verb name for the report-only check (v2.0.0+).
      # The engine keeps `check` as a deprecation alias, so a consumer whose workflow
      # calls `check` directly keeps working. This action, however, invokes `gate` —
      # so `@v2` requires a re-seeded reqmap.py (>=2.0.0). An older vendored engine does
      # not know `gate` and would exit 2 — one more reason this line is `@v2`, not a
      # re-pointed `@v1`.
      run: python -X utf8 "${{ inputs.reqmap-path }}" gate
    - name: reqmap map freshness
      if: ${{ inputs.freshness == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      # Catches a stale or never-committed map/lock — the failure mode that lets member
      # drift accumulate unseen on a fresh checkout. A repo that does not track a map
      # passes silently. REQMAP_REPO is exported ONLY when provided, because an empty
      # value means "emit no repo" to the engine and would falsely report staleness
      # against a committed map that carries a repo slug.
      run: |
        if [ -n "${{ inputs.reqmap-repo }}" ]; then
          export REQMAP_REPO="${{ inputs.reqmap-repo }}"
        fi
        python -X utf8 "${{ inputs.reqmap-path }}" map --check
    - name: reqmap requirement lint
      if: ${{ inputs.lint == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      # The gate proves the LINKS are real; it says nothing about whether the
      # requirement is readable. `lint --strict` is the prose/structure half.
      # A requirement whose shape is deliberate opts a check out per-check with
      # `lint_exempt: [check-name]` in its frontmatter.
      run: python -X utf8 "${{ inputs.reqmap-path }}" lint --strict

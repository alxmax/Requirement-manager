  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

oral-600: #cf2f4c;\n  --coral-500: #e8526a;\n  --coral-tint:#fbe0e3;\n\n  /* ---- STATUS · the requirement lifecycle ------------------------------ */\n  --status-confirmed:    var(--indigo-500);\n  --status-confirmed-bg: var(--indigo-tint);\n  --status-confirmed-ln: #c4c5e2;\n  --status-drift:        var(--amber-700);   /* readable amber on cream */\n  --status-drift-bg:     var(--amber-tint);\n  --status-drift-ln:     #ecd29a;\n  --status-error:        var(--coral-600);\n  --status-error-bg:     var(--coral-tint);\n  --status-error-ln:     #f0b6bf;\n  --status-draft:        var(--ink-2);\n  --status-draft-bg:     #efeade;\n  --status-draft-ln:     var(--line-2);\n  --status-bus:          var(--magenta-600); /* shared foundation */\n  --status-bus-bg:       var(--magenta-tint);\n  --status-bus-ln:       #e6abca;\n  --signal-gold:         #e89b16;            /* locate crosshair / highlight */\n  --signal-gold-hi:      #fbe7c4;\n\n  /* ---- COVERAGE · computed per-clause health (separate axis from status) */\n  --cov-tested:    #2e8f63;  /* every contract clause has a live test */\n  --cov-tested-bg: #e3f1ea;\n  --cov-tested-ln: #b1d8c3;\n  --cov-partial:   var(--amber-700);  /* some clauses uncovered */\n  --cov-untested:  var(--coral-600);  /* no live test, or stale ref */\n  --cov-exempt:    var(--ink-3);      /* deprecated — skipped */\n\n  /* ---- SEMANTIC SURFACES ----------------------------------------------- */\n  --bg:           var(--paper-0);\n  --bg-raised:    var(--paper-1);\n  --surface:      var(--paper-2);\n  --surface-hov:  var(--paper-3);\n  --border:       var(--line-2);\n  --border-soft:  var(--line-1);\n  --border-strong:var(--line-3);\n  --fg:           var(--ink-0);\n  --fg-secondary: var(--ink-1);\n  --fg-muted:     var(--ink-2);\n  --fg-faint:     var(--ink-3);\n  --accent:       var(--indigo-500);\n  --accent-hov:   var(--indigo-600);\n  --accent-soft:  var(--indigo-tint);\n  --accent-2:     var(--amber-500);\n  --on-accent:    #ffffff;\n  --focus-ring:   color-mix(in oklch, var(--indigo-500) 32%, transparent);\n\n  /* ---- TYPE FAMILIES --------------------------------------------------- */\n  --font-serif: \"Roboto Slab\", \"Roboto Serif\", Georgia, serif;\n  --font-sans:  \"Geist\", system-ui, -apple-system, \"Segoe UI\", sans-serif;\n  --font-mono:  \"Geist Mono\", ui-monospace, \"SF Mono\", monospace;\n\n  /* ---- TYPE SCALE ------------------------------------------------------ */\n  --text-display: 700 46px/1.06 var(--font-serif);\n  --text-h1:      700 31px/1.14 var(--font-serif);\n  --text-h2:      600 24px/1.22 var(--font-serif);\n  --text-h3:      600 20px/1.28 var(--font-sans);\n  --text-title:   600 16px/1.35 var(--font-sans);\n  --text-body:    400 15px/1.6  var(--font-sans);\n  --text-small:   400 13px/1.55 var(--font-sans);\n  --text-caption: 500 11px/1.4  var(--font-sans);\n  --text-code:    450 13px/1.55 var(--font-mono);\n  --text-id:      500 12px/1.3  var(--font-mono);\n\n  --track-tight:  -0.01em;\n  --track-normal:  0em;\n  --track-caps:    0.1em;\n\n  /* ---- SPACING · 4px grid ---------------------------------------------- */\n  --space-1: 4px;  --space-2: 8px;  --space-3: 12px; --space-4: 16px;\n  --space-5: 24px; --space-6: 32px; --space-7: 48px; --space-8: 64px;\n\n  /* ---- RADII · soft, rounded ------------------------------------------- */\n  --radius-1: 8px; --radius-2: 12px; --radius-3: 16px;\n  --radius-pill: 999px; --radius-circle: 50%;\n\n  /* ---- ELEVATION · soft on cream --------------------------------------- */\n  --shadow-1: 0 1px 2px rgba(35,36,63,0.06);\n  --shadow-2: 0 6px 20px -8px rgba(35,36,63,0.16), 0 1px 0 rgba(35,36,63,0.03);\n  --shadow-pop: 0 16px 42px -12px rgba(35,36,63,0.24);\n  --ring-soft: 0 0 0 1px var(--border-soft);\n\n  /* ---- MOTION ---------------------------------------------------------- */\n  --ease: cubic-bezier(0.2, 0, 0, 1);\n  --dur-fast: 120ms;\n  --dur: 200ms;\n\n  /* texture: faint dotted grid (matches the reference) */\n  --dot-color: rgba(35,36,63,0.05);\n}\n\n/* ============================================================================\n   DARK THEME — opt-in via <html data-theme=\"dark\">\n   Deep navy-indigo canvas; same amber/magenta/coral accents, brightened.\n   ========================================================================== */\n[data-theme=\"dark\"] {\n  --paper-0:  #14152a;\n  --paper-1:  #191b32;\n  --paper-2:  #20223e;\n  --paper-3:  #2a2c4d;\n  --line-1:   #262842;\n  --line-2:   #343761;\n  --line-3:   #454979;\n  --ink-3:    #6f7197;\n  --ink-2:    #9a9cc0;\n  --ink-1:    #c3c4e0;\n  --ink-0:    #edecf7;\n\n  --indigo-700: #5b8fe0;\n  --indigo-600: #6f9fe8;\n  --indigo-500: #84afef;   /* brightened for dark bg */\n  --indigo-400: #a3c4f4;\n  --indigo-300: #c2d6f8;\n  --indigo-tint:#1a2f55;\n\n  --amber-700: #f3b052;\n  --amber-600: #f7b13f;\n  --amber-500: #f5a623;\n  --amber-400: #f8bb52;\n  --amber-tint:#3a2c10;\n\n  --magenta-700: #ef72ab;\n  --magenta-600: #e85a9a;\n  --magenta-500: #d8559a;\n  --magenta-400: #e07cb0;\n  --magenta-tint:#3a1d36;\n\n  --coral-600: #f0697e;\n  --coral-500: #ef5a72;\n  --coral-tint:#3a1c22;\n\n  --status-confirmed:    var(--indigo-400);\n  --status-confirmed-bg: var(--indigo-tint);\n  --status-confirmed-ln: #3a3d72;\n  --status-drift:        var(--amber-500);\n  --status-drift-bg:     var(--amber-tint);\n  --status-drift-ln:     #5c4519;\n  --status-error:        var(--coral-500);\n  --status-error-bg:     var(--coral-tint);\n  --status-error-ln:     #5c2c33;\n  --status-draft:        var(--ink-2);\n  --status-draft-bg:     #20223e;\n  --status-draft-ln:     var(--line-2);\n  --status-bus:          var(--magenta-600);\n  --status-bus-bg:       var(--magenta-tint);\n  --status-bus-ln:       #5a2a4d;\n  --signal-gold:         #f5be4a;\n  --signal-gold-hi:      #3e310f;\n\n  --cov-tested:    #4cc08a;\n  --cov-tested-bg: #143226;\n  --cov-tested-ln: #2c5a3f;\n  --cov-partial:   var(--amber-500);\n  --cov-untested:  var(--coral-500);\n  --cov-exempt:    var(--ink-3);\n\n  --on-accent: #14152a;\n  --shadow-1: 0 1px 2px rgba(0,0,0,0.3);\n  --shadow-2: 0 6px 22px -8px rgba(0,0,0,0.55), 0 1px 0 rgba(255,255,255,0.03) inset;\n  --shadow-pop: 0 18px 48px -14px rgba(0,0,0,0.7);\n  --focus-ring: color-mix(in oklch, var(--indigo-400) 45%, transparent);\n  --dot-color: rgba(255,255,255,0.05);\n}\n\n/* ============================================================================\n   SEMANTIC HELPER CLASSES\n   ========================================================================== */\n.rm-type-base {\n  font: var(--text-body); letter-spacing: var(--track-normal); color: var(--fg);\n  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;\n}\n.rm-display { font: var(--text-display); letter-spacing: var(--track-tight); color: var(--fg); }\n.rm-h1 { font: var(--text-h1); letter-spacing: var(--track-tight); color: var(--fg); }\n.rm-h2 { font: var(--text-h2); color: var(--fg); }\n.rm-h3 { font: var(--text-h3); color: var(--fg); }\n.rm-title { font: var(--text-title); color: var(--fg); }\n.rm-body { font: var(--text-body); color: var(--fg-secondary); }\n.rm-small { font: var(--text-small); color: var(--fg-muted); }\n.rm-eyebrow {\n  font: var(--text-caption); letter-spacing: var(--track-caps);\n  text-transform: uppercase; color: var(--accent); font-weight: 600;\n}\n.rm-code { font: var(--text-code); color: var(--fg); }\n.rm-id { font: var(--text-id); color: var(--fg); }\n<\u002Fstyle>\n\n<style>\n  * { box-sizing: border-box; }\n  html { scroll-behavior: smooth; }\n  body {\n    margin: 0;\n    font: var(--text-body);\n    color: var(--fg);\n    background:\n      radial-gradient(var(--dot-color) 1px, transparent 1.4px) 0 0 / 22px 22px,\n      var(--bg);\n    -webkit-font-smoothing: antialiased;\n    text-rendering: optimizeLegibility;\n  }\n  a { color: var(--accent); text-decoration: none; }\n  code, .mono { font-family: var(--font-mono); }\n\n  /* ---- top bar ---- */\n  .topbar {\n    position: sticky; top: 0; z-index: 50;\n    display: flex; align-items: center; gap: var(--space-3);\n    padding: 14px clamp(20px, 5vw, 64px);\n    background: color-mix(in srgb, var(--bg) 78%, transparent);\n    backdrop-filter: blur(10px);\n    border-bottom: 1px solid var(--border-soft);\n  }\n  .topbar .mk { display: block; }\n  .brandname { font: var(--text-title); font-weight: 600; letter-spacing: var(--track-tight); }\n  .topbar .eyebrow { margin-left: auto; }\n  .eyebrow {\n    font: var(--text-caption); font-weight: 600;\n    letter-spacing: var(--track-caps); text-transform: uppercase;\n    color: var(--accent);\n  }\n  .eyebrow.muted { color: var(--fg-muted); }\n\n  /* ---- layout ---- */\n  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 clamp(20px, 5vw, 64px); }\n  section { padding: clamp(48px, 7vw, 88px) 0; border-top: 1px solid var(--border-soft); }\n  section:first-of-type { border-top: 0; }\n  .sec-head { max-width: 720px; margin-bottom: var(--space-7); }\n  .sec-head h2 { font: var(--text-h1); letter-spacing: var(--track-tight); margin: 10px 0 14px; }\n  .sec-head p { font: var(--text-body); font-size: 17px; color: var(--fg-muted); margin: 0; text-wrap: pretty; }\n\n  /* ---- hero ---- */\n  .hero { padding-top: clamp(56px, 9vw, 104px); border-top: 0; }\n  .hero h1 {\n    font: var(--text-display); font-size: clamp(40px, 6.5vw, 62px);\n    letter-spacing: var(--track-tight); line-height: 1.04;\n    margin: 16px 0 22px; max-width: 16ch; text-wrap: balance;\n  }\n  .hero .hook { font-size: clamp(20px, 2.4vw, 24px); line-height: 1.46; color: var(--fg); max-width: 30ch; margin: 0 0 20px; text-wrap: pretty; font-weight: 400; }\n  .hero .hook .fix { color: var(--accent); font-weight: 600; }\n  .hero .hook .fix strong { font-weight: 600; }\n  .hero .lede { font-size: 18px; line-height: 1.6; color: var(--fg-muted); max-width: 62ch; margin: 0; text-wrap: pretty; }\n  .hero .lede strong { color: var(--fg-secondary); font-weight: 600; }\n\n  /* ---- the one idea: three statements ---- */\n  .ideas { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-4); margin-top: var(--space-6); }\n  .idea {\n    position: relative; background: var(--surface);\n    border: 1px solid var(--border); border-radius: var(--radius-2);\n    padding: 26px 24px 24px;\n  }\n  .idea .num {\n    font: var(--text-id); font-size: 13px; color: var(--accent);\n    border: 1px solid var(--border); border-radius: var(--radius-pill);\n    width: 30px; height: 30px; display: grid; place-items: center; margin-bottom: 16px;\n  }\n  .idea h3 { font: var(--text-h3); margin: 0 0 8px; letter-spacing: var(--track-tight); }\n  .idea p { margin: 0; font: var(--text-small); font-size: 14px; color: var(--fg-muted); }\n  .idea p code { font-size: 12.5px; color: var(--fg-secondary); background: var(--bg-raised); padding: 1px 5px; border-radius: 5px; }\n\n  /* ---- badge cards (vocabulary) ---- */\n  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-4); }\n  .grid2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--space-4); }\n  .vcard {\n    background: var(--surface); border: 1px solid var(--border);\n    border-radius: var(--radius-3); padding: 26px 24px;\n    transition: border-color var(--dur) var(--ease), transform var(--dur) var(--ease);\n  }\n  .vcard:hover { border-color: var(--border-strong); transform: translateY(-1px); }\n  .vrow { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }\n  .badge {\n    flex: none; width: 54px; height: 54px; border-radius: 50%;\n    border: 2.5px solid currentColor; display: grid; place-items: center;\n  }\n  .badge svg { width: 24px; height: 24px; }\n  .vcard h3 { font: var(--text-h3); margin: 0; letter-spacing: var(--track-tight); color: var(--fg); }\n  .vcard .kicker { font: var(--text-id); font-size: 11px; color: var(--fg-faint); text-transform: uppercase; letter-spacing: var(--track-caps); margin-top: 3px; }\n  .vcard p { margin: 0; font: var(--text-small); font-size: 14px; color: var(--fg-muted); text-wrap: pretty; }\n  .vcard p code { font-family: var(--font-mono); font-size: 12.5px; color: var(--fg-secondary); }\n  .tint-indigo { color: var(--indigo-500); }\n  .tint-magenta { color: var(--magenta-600); }\n  .tint-amber { color: var(--amber-600); }\n  .tint-coral { color: var(--coral-600); }\n  .tint-gold { color: var(--signal-gold); }\n\n  /* ---- diagrams ---- */\n  .diagram { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-3); padding: 28px clamp(16px, 3vw, 36px); }\n  .diagram svg { width: 100%; height: auto; display: block; }\n  .dg-node { fill: var(--surface); stroke: var(--border-strong); stroke-width: 1.5; }\n  .dg-node.center { fill: var(--indigo-tint); stroke: var(--indigo-500); stroke-width: 2; }\n  .dg-title { font: 600 17px/1 var(--font-sans); fill: var(--fg); }\n  .dg-title.c { font: 700 19px/1 var(--font-serif); fill: var(--indigo-700); }\n  .dg-sub { font: 400 12.5px/1 var(--font-mono); fill: var(--fg-muted); }\n  .dg-edge { stroke: var(--border-strong); stroke-width: 1.75; fill: none; }\n  .dg-edge.out { stroke: var(--magenta-500); }\n  .dg-lbl { font: 500 12px/1 var(--font-mono); fill: var(--fg-secondary); letter-spacing: 0.02em; }\n  .dg-lbl.out { fill: var(--magenta-600); }\n  .dg-cap { font: var(--text-small); color: var(--fg-muted); text-align: center; margin: 18px auto 0; max-width: 60ch; }\n\n  /* ---- lifecycle pipeline ---- */\n  .loop { display: grid; grid-template-columns: repeat(6, 1fr); gap: 0; margin-top: var(--space-3); }\n  .stage { position: relative; text-align: center; padding: 0 6px; }\n  .stage::before {\n    content: \"\"; position: absolute; top: 27px; left: -50%; width: 100%;\n    height: 2px; background: var(--border); z-index: 0;\n  }\n  .stage:first-child::before { display: none; }\n  .stage .badge { margin: 0 auto 14px; width: 54px; height: 54px; position: relative; z-index: 1; background: var(--surface); }\n  .stage h4 { font: var(--text-title); margin: 0 0 5px; letter-spacing: var(--track-tight); }\n  .stage .cmd { font: var(--text-id); font-size: 11.5px; color: var(--accent); }\n  .stage p { font: var(--text-small); font-size: 12.5px; color: var(--fg-muted); margin: 7px 0 0; }\n  .loop-note { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: var(--space-6); font: var(--text-small); color: var(--fg-muted); }\n  .loop-note span.ar { color: var(--accent); font-size: 16px; }\n\n  /* ---- the map ---- */\n  .maptabs { display: flex; gap: 6px; margin-bottom: 18px; flex-wrap: wrap; }\n  .maptab { font: var(--text-small); font-weight: 500; padding: 6px 13px; border: 1px solid var(--border); background: var(--bg); color: var(--fg-secondary); border-radius: var(--radius-1); }\n  .maptab.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }\n  .mapcanvas {\n    border: 1px solid var(--border); border-radius: var(--radius-2);\n    background:\n      radial-gradient(var(--dot-color) 1px, transparent 1.4px) 0 0 / 20px 20px,\n      var(--bg-raised);\n    padding: 8px clamp(8px, 2vw, 20px);\n  }\n  .mapcanvas svg { width: 100%; height: auto; display: block; }\n  .mn { fill: var(--surface); stroke: var(--border-strong); stroke-width: 1.5; }\n  .mn-bus { fill: var(--surface); stroke: var(--magenta-500); stroke-width: 2; }\n  .mn-ring { fill: none; stroke: var(--indigo-500); stroke-width: 2; }\n  .mn-t { font: 600 15px/1 var(--font-sans); fill: var(--fg); }\n  .mn-i { font: 400 12px/1 var(--font-mono); fill: var(--fg-muted); }\n  .me { fill: none; stroke: var(--border-strong); stroke-width: 1.75; }\n  .me-trace { fill: none; stroke: var(--signal-gold); stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }\n  .maplegend { display: flex; flex-wrap: wrap; gap: 18px 26px; margin-top: 20px; }\n  .maplegend .lg { display: flex; align-items: center; gap: 9px; font: var(--text-small); font-size: 13px; color: var(--fg-muted); }\n  .maplegend .sw { width: 26px; height: 16px; border-radius: 5px; flex: none; }\n  .maplegend .sw.feature { border: 1.5px solid var(--border-strong); background: var(--surface); }\n  .maplegend .sw.bus { border: 2px solid var(--magenta-500); background: var(--surface); }\n  .maplegend .ln { width: 26px; height: 0; flex: none; }\n  .maplegend .ln.dep { border-top: 2px solid var(--border-strong); }\n  .maplegend .ln.trace { border-top: 3px solid var(--signal-gold); }\n\n  /* ---- the thread: example ---- */\n  .thread { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); align-items: stretch; }\n  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-2); overflow: hidden; }\n  .panel-head { display: flex; align-items: center; gap: 9px; padding: 12px 18px; border-bottom: 1px solid var(--border-soft); background: var(--bg-raised); }\n  .panel-head .ttl { font: var(--text-caption); font-weight: 600; text-transform: uppercase; letter-spacing: var(--track-caps); color: var(--fg-muted); }\n  .panel-head .file { margin-left: auto; font: var(--text-id); font-size: 11px; color: var(--fg-faint); }\n  .panel-body { padding: 18px; }\n\n  /* requirement card mini */\n  .req-top { display: flex; align-items: center; gap: 9px; margin-bottom: 11px; flex-wrap: wrap; }\n  .req-id { font: var(--text-id); }\n  .pill { font: var(--text-caption); font-weight: 600; padding: 3px 9px; border-radius: var(--radius-pill); border: 1px solid; display: inline-flex; align-items: center; gap: 5px; }\n  .pill .dot { width: 7px; height: 7px; border-radius: 999px; }\n  .pill.confirmed { background: var(--status-confirmed-bg); border-color: var(--status-confirmed-ln); color: var(--status-confirmed); }\n  .pill.confirmed .dot { background: var(--status-confirmed); }\n  .pill.bus { background: var(--status-bus-bg); border-color: var(--status-bus-ln); color: var(--status-bus); }\n  .pill.bus .dot { background: var(--status-bus); }\n  .req-title { font: var(--text-h3); margin: 0 0 4px; letter-spacing: var(--track-tight); }\n  .req-intent { font: var(--text-small); font-style: italic; color: var(--fg-muted); margin: 0 0 14px; }\n  .req-eye { font: var(--text-caption); letter-spacing: var(--track-caps); text-transform: uppercase; color: var(--accent); font-weight: 600; margin-bottom: 6px; }\n  .req-shall { font: var(--text-small); color: var(--fg-secondary); margin: 0; padding-left: 14px; position: relative; }\n  .req-shall::before { content: \"—\"; position: absolute; left: 0; color: var(--fg-faint); }\n  .req-shall code { font-family: var(--font-mono); font-size: 12px; }\n\n  /* code block */\n  .code { font: var(--text-code); line-height: 1.7; white-space: pre; overflow-x: auto; margin: 0; color: var(--fg-secondary); }\n  .code .cm { color: var(--fg-faint); }\n  .code .tag { color: var(--magenta-600); font-weight: 500; }\n  .code .id { color: var(--indigo-600); }\n  .code .kw { color: var(--indigo-600); }\n  .bind-note { display: flex; align-items: center; gap: 8px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border-soft); font: var(--text-small); font-size: 13px; color: var(--fg-muted); }\n  .bind-note .tag { color: var(--magenta-600); font-family: var(--font-mono); }\n\n  /* ---- terminal ---- */\n  .term {\n    background: #0b1622; border: 1px solid #22323f; border-radius: var(--radius-2);\n    padding: 18px 20px; font: var(--text-code); font-size: 13px; line-height: 1.75; color: #cdd6df;\n    overflow-x: auto; white-space: pre;\n  }\n  .term .dim { color: #8a887f; }\n  .term .grn { color: #97c459; }\n  .term .amb { color: #fac775; }\n  .term .red { color: #ea8c83; }\n  .term .acc { color: #afa9ec; }\n  .term .pr { color: #8a887f; }\n  .term .cmd { color: #e6e9ee; }\n\n  .two { display: grid; grid-template-columns: 1.1fr 1fr; gap: var(--space-5); align-items: start; }\n  .two .copy h3 { font: var(--text-h2); margin: 0 0 14px; letter-spacing: var(--track-tight); }\n  .two .copy p { font: var(--text-body); color: var(--fg-secondary); margin: 0 0 14px; max-width: 50ch; text-wrap: pretty; }\n  .cmdlist { list-style: none; margin: 18px 0 0; padding: 0; display: grid; gap: 2px; }\n  .cmdlist li { display: grid; grid-template-columns: 130px 1fr; gap: 14px; padding: 9px 0; border-top: 1px solid var(--border-soft); align-items: baseline; }\n  .cmdlist code { font: var(--text-id); font-size: 13px; color: var(--accent); }\n  .cmdlist span { font: var(--text-small); font-size: 13px; color: var(--fg-muted); }\n\n  /* ---- first run ---- */\n  .initsteps { list-style: none; margin: 0 0 22px; padding: 0; display: grid; gap: 12px; }\n  .initsteps li { display: grid; grid-template-columns: 22px 1fr; gap: 12px; align-items: start; font: var(--text-small); font-size: 14px; color: var(--fg-secondary); }\n  .initsteps .ck { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--indigo-500); color: var(--indigo-500); display: grid; place-items: center; flex: none; margin-top: 1px; }\n  .initsteps .ck svg { width: 12px; height: 12px; }\n  .initsteps code { font-family: var(--font-mono); font-size: 12.5px; color: var(--fg); background: var(--bg-raised); padding: 1px 5px; border-radius: 5px; }\n  .pathchip {\n    display: flex; align-items: center; gap: 13px; margin-top: 4px;\n    background: var(--signal-gold-hi); border: 1px solid var(--signal-gold);\n    border-radius: var(--radius-2); padding: 14px 16px;\n  }\n  .pathchip .pc-ic { color: var(--signal-gold); flex: none; display: grid; place-items: center; }\n  .pathchip .pc-ic svg { width: 22px; height: 22px; }\n  .pathchip .pc-path { font: var(--text-id); font-size: 14px; color: var(--fg); font-weight: 500; }\n  .pathchip .pc-sub { font: var(--text-small); font-size: 12.5px; color: var(--fg-muted); margin-top: 2px; }\n\n  /* ---- packaging ---- */\n  .ship { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-4); }\n  .ship .step {\n    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-2);\n    padding: 22px 22px; position: relative;\n  }\n  .ship .step .ar { position: absolute; right: -18px; top: 50%; transform: translateY(-50%); color: var(--border-strong); font-size: 20px; z-index: 2; }\n  .ship .step:last-child .ar { display: none; }\n  .ship .step .lbl { font: var(--text-id); font-size: 11px; color: var(--accent); text-transform: uppercase; letter-spacing: var(--track-caps); }\n  .ship .step h4 { font: var(--text-title); margin: 8px 0 6px; letter-spacing: var(--track-tight); }\n  .ship .step p { font: var(--text-small); font-size: 13px; color: var(--fg-muted); margin: 0; }\n  .ship .step code { font-family: var(--font-mono); font-size: 12px; color: var(--fg-secondary); }\n\n  /* ---- callout ---- */\n  .callout {\n    border: 1px solid var(--indigo-300); background: var(--indigo-tint);\n    border-radius: var(--radius-3); padding: 28px clamp(22px, 4vw, 40px);\n    display: flex; gap: 20px; align-items: flex-start;\n  }\n  .callout .badge { color: var(--indigo-600); border-color: var(--indigo-500); flex: none; }\n  .callout p { margin: 0; font: var(--text-h3); font-weight: 400; line-height: 1.45; color: var(--fg); max-width: 60ch; text-wrap: pretty; }\n  .callout p strong { font-weight: 600; }\n\n  /* ---- footer ---- */\n  footer { border-top: 1px solid var(--border-soft); padding: 40px 0 64px; }\n  .foot { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }\n  .foot .mk { flex: none; }\n  .foot .quote { font: var(--text-body); font-style: italic; color: var(--fg-secondary); }\n  .foot .refs { margin-left: auto; font: var(--text-id); font-size: 11.5px; color: var(--fg-faint); display: flex; gap: 16px; flex-wrap: wrap; }\n\n  @media (max-width: 880px) {\n    .ideas, .grid3, .grid2, .thread, .ship, .two { grid-template-columns: 1fr; }\n    .loop { grid-template-columns: repeat(3, 1fr); row-gap: 36px; }\n    .stage:nth-child(4)::before { display: none; }\n    .ship .step .ar { display: none; }\n    .foot .refs { margin-left: 0; width: 100%; }\n  }\n  @media (max-width: 520px) {\n    .loop { grid-template-columns: repeat(2, 1fr); }\n    .stage:nth-child(3)::before, .stage:nth-child(5)::before { display: none; }\n  }\n\n  @media (prefers-reduced-motion: no-preference) {\n    .reveal { opacity: 0; transform: translateY(8px); transition: opacity 480ms var(--ease), transform 480ms var(--ease); }\n    .reveal.in { opacity: 1; transform: none; }\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<header class=\"topbar\">\n  <svg class=\"mk\" width=\"26\" height=\"26\" viewBox=\"0 0 64 64\" fill=\"none\" aria-hidden=\"true\">\n    <defs><linearGradient id=\"lgTop\" x1=\"10\" y1=\"8\" x2=\"54\" y2=\"56\" gradientUnits=\"userSpaceOnUse\"><stop offset=\"0\" stop-color=\"#2160c6\"><\u002Fstop><stop offset=\"1\" stop-color=\"#c0206a\"><\u002Fstop><\u002FlinearGradient><\u002Fdefs>\n    <circle cx=\"32\" cy=\"32\" r=\"28.5\" stroke=\"url(#lgTop)\" stroke-width=\"3\"><\u002Fcircle>\n    <line x1=\"25\" y1=\"25\" x2=\"39\" y2=\"39\" stroke=\"#8d8fa3\" stroke-width=\"2.6\"><\u002Fline>\n    <rect x=\"17\" y=\"17\" width=\"14\" height=\"14\" rx=\"2.5\" stroke=\"#2160c6\" stroke-width=\"2.6\"><\u002Frect>\n    <rect x=\"33\" y=\"33\" width=\"14\" height=\"14\" rx=\"2.5\" fill=\"#f5a623\"><\u002Frect>\n  <\u002Fsvg>\n  <span class=\"brandname\">Requirement Manager<\u002Fspan>\n  <span class=\"eyebrow\">Architecture · read me first<\u002Fspan>\n<\u002Fheader>\n\n<main>\n\n<!-- ===================== HERO ===================== -->\n<section class=\"hero\" data-screen-label=\"Hero\">\n  <div class=\"wrap\">\n    <p class=\"eyebrow\">The problem, and the fix<\u002Fp>\n    <h1>Requirements are the truth. Code points back to them.<\u002Fh1>\n    <p class=\"hook\">Inherited a legacy codebase with no single source of truth? Or vibecoded your way into something that’s slipped out of control? <span class=\"fix\"><strong>Requirement Manager<\u002Fstrong><\u002Fspan> — a skill shipped as a Claude Code plugin — is how you take the reins back.<\u002Fp>\n    <p class=\"lede\">Most projects keep the answer to <em>“what is this software supposed to do?”<\u002Fem> scattered across people’s heads, stale docs, and the code itself. Requirement Manager makes that answer explicit and keeps it honest: <strong>each capability is one markdown file<\u002Fstrong>, code links back to it with a <strong>tag<\u002Fstrong>, and a small script <strong>fails the build<\u002Fstrong> the moment the two drift apart.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================== THE ONE IDEA ===================== -->\n<section data-screen-label=\"The one idea\">\n  <div class=\"wrap\">\n    <div class=\"sec-head reveal\">\n      <p class=\"eyebrow muted\">The one idea<\u002Fp>\n      <h2>Stay in control of code you didn’t hand-write.<\u002Fh2>\n      <p>When you let an agent generate code fast, it’s easy to lose track of what the project actually <em>does<\u002Fem> — and whether it still does what you meant. Requirement Manager keeps you in the driver’s seat: you write down what each part is <strong>supposed<\u002Fstrong> to do, the tool ties that to the real code, and it warns you the moment the two stop agreeing. Three moving parts make it work.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"ideas\">\n      <div class=\"idea reveal\">\n        <div class=\"num\">1<\u002Fdiv>\n        <h3>One file per capability<\u002Fh3>\n        <p>Each thing the software does is described in a single markdown file — the <strong>single source of truth<\u002Fstrong>. Nothing else restates it; everyone references it by id.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"idea reveal\">\n        <div class=\"num\">2<\u002Fdiv>\n        <h3>Code links back with a tag<\u002Fh3>\n        <p>Source files declare which requirement they belong to with a one-line comment, like <code># implements: CORE-PARSE-001<\u002Fcode>. The links are <strong>found by scanning<\u002Fstrong>, never typed up by hand.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"idea reveal\">\n        <div class=\"num\">3<\u002Fdiv>\n        <h3>A gate fails the build on drift<\u002Fh3>\n        <p>One command, <code>check<\u002Fcode>, runs in CI. If a tag points nowhere, or a requirement’s text changed but its code didn’t, it <strong>exits non-zero<\u002Fstrong> and stops the merge.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================== META-MODEL DIAGRAM ===================== -->\n<section data-screen-label=\"Meta-model\">\n  <div class=\"wrap\">\n    <div class=\"sec-head reveal\">\n      <p class=\"eyebrow muted\">The meta-model<\u002Fp>\n      <h2>The requirement sits in the center.<\u002Fh2>\n      <p>Read the diagram outside-in: input feeds a requirement, code implements it, tests verify it — and the requirement produces the map you browse. Authority only ever flows one way: if code and requirement disagree, the requirement wins.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"diagram reveal\">\n      <svg viewBox=\"0 0 920 540\" role=\"img\" aria-label=\"Requirement at the center; input feeds it, code implements it, acceptance verifies it, and it produces the map.\">\n        <defs>\n          <marker id=\"ah\" markerWidth=\"9\" markerHeight=\"9\" refX=\"6.5\" refY=\"3\" orient=\"auto\" markerUnits=\"userSpaceOnUse\">\n            <path d=\"M0,0 L7,3 L0,6 Z\" fill=\"var(--border-strong)\"><\u002Fpath>\n          <\u002Fmarker>\n          <marker id=\"ahm\" markerWidth=\"9\" markerHeight=\"9\" refX=\"6.5\" refY=\"3\" orient=\"auto\" markerUnits=\"userSpaceOnUse\">\n            <path d=\"M0,0 L7,3 L0,6 Z\" fill=\"var(--magenta-500)\"><\u002Fpath>\n          <\u002Fmarker>\n        <\u002Fdefs>\n\n        <!-- edges (drawn first, behind nodes) -->\n        <!-- input -> requirement -->\n        <path class=\"dg-edge\" d=\"M222,270 L356,270\" marker-end=\"url(#ah)\"><\u002Fpath>\n        <text class=\"dg-lbl\" x=\"289\" y=\"259\" text-anchor=\"middle\">feeds<\u002Ftext>\n        <!-- acceptance -> requirement -->\n        <path class=\"dg-edge\" d=\"M460,112 L460,216\" marker-end=\"url(#ah)\"><\u002Fpath>\n        <text class=\"dg-lbl\" x=\"472\" y=\"170\" text-anchor=\"start\">verifies<\u002Ftext>\n        <!-- code -> requirement -->\n        <path class=\"dg-edge\" d=\"M460,428 L460,326\" marker-end=\"url(#ah)\"><\u002Fpath>\n        <text class=\"dg-lbl\" x=\"472\" y=\"382\" text-anchor=\"start\">implements<\u002Ftext>\n        <!-- requirement -> map -->\n        <path class=\"dg-edge out\" d=\"M564,270 L698,270\" marker-end=\"url(#ahm)\"><\u002Fpath>\n        <text class=\"dg-lbl out\" x=\"631\" y=\"259\" text-anchor=\"middle\">produces<\u002Ftext>\n\n        <!-- nodes -->\n        <!-- center: requirement -->\n        <rect class=\"dg-node center\" x=\"360\" y=\"218\" width=\"200\" height=\"104\" rx=\"14\"><\u002Frect>\n        <text class=\"dg-title c\" x=\"460\" y=\"262\" text-anchor=\"middle\">Requirement<\u002Ftext>\n        <text class=\"dg-sub\" x=\"460\" y=\"288\" text-anchor=\"middle\">.md + frontmatter<\u002Ftext>\n\n        <!-- left: input -->\n        <rect class=\"dg-node\" x=\"72\" y=\"238\" width=\"150\" height=\"64\" rx=\"12\"><\u002Frect>\n        <text class=\"dg-title\" x=\"147\" y=\"266\" text-anchor=\"middle\">Input<\u002Ftext>\n        <text class=\"dg-sub\" x=\"147\" y=\"286\" text-anchor=\"middle\">code · prose<\u002Ftext>\n\n        <!-- top: acceptance -->\n        <rect class=\"dg-node\" x=\"380\" y=\"48\" width=\"160\" height=\"64\" rx=\"12\"><\u002Frect>\n        <text class=\"dg-title\" x=\"460\" y=\"76\" text-anchor=\"middle\">Acceptance<\u002Ftext>\n        <text class=\"dg-sub\" x=\"460\" y=\"96\" text-anchor=\"middle\">tested-by<\u002Ftext>\n\n        <!-- bottom: code -->\n        <rect class=\"dg-node\" x=\"380\" y=\"428\" width=\"160\" height=\"64\" rx=\"12\"><\u002Frect>\n        <text class=\"dg-title\" x=\"460\" y=\"456\" text-anchor=\"middle\">Code member<\u002Ftext>\n        <text class=\"dg-sub\" x=\"460\" y=\"476\" text-anchor=\"middle\">file:line tag<\u002Ftext>\n\n        <!-- right: map -->\n        <rect class=\"dg-node\" x=\"698\" y=\"238\" width=\"160\" height=\"64\" rx=\"12\"><\u002Frect>\n        <text class=\"dg-title\" x=\"778\" y=\"266\" text-anchor=\"middle\">Map<\u002Ftext>\n        <text class=\"dg-sub\" x=\"778\" y=\"286\" text-anchor=\"middle\">HTML viewer<\u002Ftext>\n      <\u002Fsvg>\n      <p class=\"dg-cap\">Code declares membership with a tag; the member list is discovered by scanning — never hand-maintained.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================== VOCABULARY ===================== -->\n<section data-screen-label=\"Vocabulary\">\n  <div class=\"wrap\">\n    <div class=\"sec-head reveal\">\n      <p class=\"eyebrow muted\">Words you’ll need<\u002Fp>\n      <h2>Six terms, in plain language.<\u002Fh2>\n      <p>The codebase uses these exact words everywhere. Get them once and the rest reads easily.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"grid3\">\n      <div class=\"vcard reveal\">\n        <div class=\"vrow\">\n          <span class=\"badge tint-indigo\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z\"><\u002Fpath><path d=\"M14 2v4a2 2 0 0 0 2 2h4\"><\u002Fpath><path d=\"M16 13H8\"><\u002Fpath><path d=\"M16 17H8\"><\u002Fpath><path d=\"M10 9H8\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n          <div><h3>Requirement<\u002Fh3><div class=\"kicker\">a.k.a. capability<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <p>One tracked unit of intent, written as a single markdown file with an id like <code>CORE-PARSE-001<\u002Fcode>. It says what the software must do.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"vcard reveal\">\n        <div class=\"vrow\">\n          <span class=\"badge tint-magenta\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"6\" x2=\"6\" y1=\"3\" y2=\"15\"><\u002Fline><circle cx=\"18\" cy=\"6\" r=\"3\"><\u002Fcircle><circle cx=\"6\" cy=\"18\" r=\"3\"><\u002Fcircle><path d=\"M18 9a9 9 0 0 1-9 9\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n          <div><h3>Member<\u002Fh3><div class=\"kicker\">the tag in code<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <p>A line of code — a <code>file:line<\u002Fcode> — that carries a tag pointing at a requirement. It’s the thread that ties code to intent.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"vcard reveal\">\n        <div class=\"vrow\">\n          <span class=\"badge tint-indigo\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m3 17 2 2 4-4\"><\u002Fpath><path d=\"m3 7 2 2 4-4\"><\u002Fpath><path d=\"M13 6h8\"><\u002Fpath><path d=\"M13 12h8\"><\u002Fpath><path d=\"M13 18h8\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n          <div><h3>Contract<\u002Fh3><div class=\"kicker\">the normative part<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <p>The “it shall…” lines inside a requirement — the testable behavior. Editing the contract is what changes its lock hash.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"vcard reveal\">\n        <div class=\"vrow\">\n          <span class=\"badge tint-amber\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"><\u002Fcircle><path d=\"m21 21-4.3-4.3\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n          <div><h3>Drift<\u002Fh3><div class=\"kicker\">the thing it catches<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <p>When code quietly stops matching what it was supposed to do. Detected as: the requirement’s saved hash no longer matches its current text.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"vcard reveal\">\n        <div class=\"vrow\">\n          <span class=\"badge tint-indigo\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1Z\"><\u002Fpath><path d=\"m9 12 2 2 4-4\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n          <div><h3>The gate<\u002Fh3><div class=\"kicker\">the check command<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <p>The automatic checkpoint run in CI. If links or hashes are out of sync it blocks the merge — like a build that won’t pass tests.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"vcard reveal\">\n        <div class=\"vrow\">\n          <span class=\"badge tint-magenta\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"16\" y=\"16\" width=\"6\" height=\"6\" rx=\"1\"><\u002Frect><rect x=\"2\" y=\"16\" width=\"6\" height=\"6\" rx=\"1\"><\u002Frect><rect x=\"9\" y=\"2\" width=\"6\" height=\"6\" rx=\"1\"><\u002Frect><path d=\"M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3\"><\u002Fpath><path d=\"M12 12V8\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n          <div><h3>Status &amp; layer<\u002Fh3><div class=\"kicker\">how reqs are sorted<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <p><strong>Status<\u002Fstrong> is its life stage — <code>draft → baseline → confirmed<\u002Fcode>. <strong>Layer<\u002Fstrong> is <code>bus<\u002Fcode> (shared foundation) or <code>feature<\u002Fcode> (built on the bus).<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================== THE THREAD: REAL EXAMPLE ===================== -->\n<section data-screen-label=\"The thread\">\n  <div class=\"wrap\">\n    <div class=\"sec-head reveal\">\n      <p class=\"eyebrow muted\">The thread, for real<\u002Fp>\n      <h2>How one requirement binds to its code.<\u002Fh2>\n      <p>Left: the requirement file — the source of truth. Right: the code that implements it, tagged so the tool can find the link. The same id appears in both. That’s the entire binding.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"thread\">\n      <div class=\"panel reveal\">\n        <div class=\"panel-head\">\n          <span class=\"ttl\">Requirement<\u002Fspan>\n          <span class=\"file\">requirements/CORE-PARSE-001.md<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"panel-body\">\n          <div class=\"req-top\">\n            <span class=\"req-id\">CORE-PARSE-001<\u002Fspan>\n            <span class=\"pill confirmed\"><span class=\"dot\"><\u002Fspan>confirmed<\u002Fspan>\n            <span class=\"pill bus\"><span class=\"dot\"><\u002Fspan>bus<\u002Fspan>\n          <\u002Fdiv>\n          <h3 class=\"req-title\">Requirement reading<\u002Fh3>\n          <p class=\"req-intent\">Turn the requirement files on disk into structured records the rest of the tool reasons about.<\u002Fp>\n          <div class=\"req-eye\">What — Contract<\u002Fdiv>\n          <p class=\"req-shall\">It shall parse each <code>requirements/*.md<\u002Fcode> into a record <code>{meta, body, path}<\u002Fcode>.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"panel reveal\">\n        <div class=\"panel-head\">\n          <span class=\"ttl\">Code member<\u002Fspan>\n          <span class=\"file\">scripts/reqmap.py<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"panel-body\">\n<pre class=\"code\"><span class=\"cm\"># implements: <span class=\"id\">CORE-PARSE-001<\u002Fspan><\u002Fspan>\n<span class=\"kw\">def<\u002Fspan> parse_requirement(path):\n    meta = _read_frontmatter(path)\n    body = _strip_frontmatter(path)\n    <span class=\"kw\">return<\u002Fspan> {<span class=\"id\">\"meta\"<\u002Fspan>: meta,\n            <span class=\"id\">\"body\"<\u002Fspan>: body,\n            <span class=\"id\">\"path\"<\u002Fspan>: path}\n\n<span class=\"cm\"># tested-by: <span class=\"id\">CORE-PARSE-001<\u002Fspan><\u002Fspan>\n<span class=\"kw\">def<\u002Fspan> test_parse_reads_frontmatter():\n    ...<\u002Fpre>\n          <div class=\"bind-note\">\n            <span>The scanner reads <span class=\"tag\"># implements:<\u002Fspan> and links <code>reqmap.py:73<\u002Fcode> to the requirement above. No list is kept by hand.<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================== TWO WAYS IN ===================== -->\n<section data-screen-label=\"Two ways in\">\n  <div class=\"wrap\">\n    <div class=\"sec-head reveal\">\n      <p class=\"eyebrow muted\">Two ways in<\u002Fp>\n      <h2>You can author from either end of the thread.<\u002Fh2>\n      <p>The binding works both directions. One important thing: the tool <strong>doesn’t write code<\u002Fstrong> — Claude Code (or you) does that. Requirement Manager holds the intent as the source of truth, binds the code to it, and checks the result.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"grid2\">\n      <div class=\"vcard reveal\">\n        <div class=\"vrow\">\n          <span class=\"badge tint-amber\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"4 17 10 11 4 5\"><\u002Fpolyline><line x1=\"12\" x2=\"20\" y1=\"19\" y2=\"19\"><\u002Fline><\u002Fsvg><\u002Fspan>\n          <div><h3>Code first<\u002Fh3><div class=\"kicker\">you already have code<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <p>Point <code>extract<\u002Fcode> at the repo and it reads the code, drafting a requirement per file. You get a starting map of what’s actually there, then review and confirm.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"vcard reveal\">\n        <div class=\"vrow\">\n          <span class=\"badge tint-indigo\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z\"><\u002Fpath><path d=\"M14 2v4a2 2 0 0 0 2 2h4\"><\u002Fpath><path d=\"m9 14 2 2 4-4\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n          <div><h3>Requirement first<\u002Fh3><div class=\"kicker\">spec, then build<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <p>Write the requirement with <code>new<\u002Fcode> — the brief. Claude Code builds to it; the code gets tagged <code># implements:<\u002Fcode>. Until it exists, the gate shows it as an <strong>orphan<\u002Fstrong>, so a written-but-unbuilt feature can’t be forgotten.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================== LIFECYCLE LOOP ===================== -->\n<section data-screen-label=\"Lifecycle\">\n  <div class=\"wrap\">\n    <div class=\"sec-head reveal\">\n      <p class=\"eyebrow muted\">The lifecycle loop<\u002Fp>\n      <h2>Six steps, repeated on every change.<\u002Fh2>\n      <p>This is the rhythm of working with the tool — from pulling first-draft requirements out of legacy code, all the way to the CI gate that keeps everything honest.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"loop reveal\">\n      <div class=\"stage\">\n        <span class=\"badge tint-amber\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 7V5a2 2 0 0 1 2-2h2\"><\u002Fpath><path d=\"M17 3h2a2 2 0 0 1 2 2v2\"><\u002Fpath><path d=\"M21 17v2a2 2 0 0 1-2 2h-2\"><\u002Fpath><path d=\"M7 21H5a2 2 0 0 1-2-2v-2\"><\u002Fpath><path d=\"M7 12h10\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <h4>Extract<\u002Fh4>\n        <div class=\"cmd\">extract<\u002Fdiv>\n        <p>Draft requirements from untagged legacy code.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"stage\">\n        <span class=\"badge tint-indigo\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z\"><\u002Fpath><path d=\"M14 2v4a2 2 0 0 0 2 2h4\"><\u002Fpath><path d=\"M16 13H8\"><\u002Fpath><path d=\"M16 17H8\"><\u002Fpath><path d=\"M10 9H8\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <h4>Author<\u002Fh4>\n        <div class=\"cmd\">new · promote<\u002Fdiv>\n        <p>Write the contract; a human confirms intent.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"stage\">\n        <span class=\"badge tint-magenta\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"6\" x2=\"6\" y1=\"3\" y2=\"15\"><\u002Fline><circle cx=\"18\" cy=\"6\" r=\"3\"><\u002Fcircle><circle cx=\"6\" cy=\"18\" r=\"3\"><\u002Fcircle><path d=\"M18 9a9 9 0 0 1-9 9\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <h4>Bind<\u002Fh4>\n        <div class=\"cmd\">scan<\u002Fdiv>\n        <p>Tag code; scan links each member to its id.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"stage\">\n        <span class=\"badge tint-indigo\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"18\" height=\"11\" x=\"3\" y=\"11\" rx=\"2\" ry=\"2\"><\u002Frect><path d=\"M7 11V7a5 5 0 0 1 10 0v4\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <h4>Lock<\u002Fh4>\n        <div class=\"cmd\">check --update-lock<\u002Fdiv>\n        <p>Hash each contract as the drift baseline.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"stage\">\n        <span class=\"badge tint-coral\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1Z\"><\u002Fpath><path d=\"m9 12 2 2 4-4\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <h4>Check<\u002Fh4>\n        <div class=\"cmd\">check<\u002Fdiv>\n        <p>The gate: error on broken links, warn on drift.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"stage\">\n        <span class=\"badge tint-magenta\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"16\" y=\"16\" width=\"6\" height=\"6\" rx=\"1\"><\u002Frect><rect x=\"2\" y=\"16\" width=\"6\" height=\"6\" rx=\"1\"><\u002Frect><rect x=\"9\" y=\"2\" width=\"6\" height=\"6\" rx=\"1\"><\u002Frect><path d=\"M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3\"><\u002Fpath><path d=\"M12 12V8\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <h4>Map<\u002Fh4>\n        <div class=\"cmd\">map · next<\u002Fdiv>\n        <p>Render the graph and the worklist.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"loop-note\"><span class=\"ar\">↺<\u002Fspan> Every code or contract change starts the loop again — <code class=\"mono\" style=\"font-size:12px;color:var(--fg-secondary)\">scan → check --update-lock → map<\u002Fcode> runs as one unit.<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================== THE MAP ===================== -->\n<section data-screen-label=\"The map\">\n  <div class=\"wrap\">\n    <div class=\"sec-head reveal\">\n      <p class=\"eyebrow muted\">The map<\u002Fp>\n      <h2>See the whole web at a glance.<\u002Fh2>\n      <p>The tool renders every requirement as a node and every <code>depends_on<\u002Fcode> as an arrow. Shared foundations — the <strong>bus<\u002Fstrong> layer — collect the most arrows; features hang off them. Click any node to trace its path and center it.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"reveal\">\n      <div class=\"maptabs\">\n        <span class=\"maptab on\">System map<\u002Fspan>\n        <span class=\"maptab\">Req → code<\u002Fspan>\n        <span class=\"maptab\">Dependencies<\u002Fspan>\n        <span class=\"maptab\">Risk<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"mapcanvas\">\n        <svg viewBox=\"0 0 1000 440\" role=\"img\" aria-label=\"Dependency map: the gate and next-steps features depend on the scanning and drift bus nodes, which in turn depend on the central requirement-reading bus node.\">\n          <defs>\n            <marker id=\"mah\" markerWidth=\"9\" markerHeight=\"9\" refX=\"6\" refY=\"3\" orient=\"auto\" markerUnits=\"userSpaceOnUse\">\n              <path d=\"M0,0 L7,3 L0,6 Z\" fill=\"var(--border-strong)\"><\u002Fpath>\n            <\u002Fmarker>\n            <marker id=\"mahg\" markerWidth=\"11\" markerHeight=\"11\" refX=\"6.5\" refY=\"3.5\" orient=\"auto\" markerUnits=\"userSpaceOnUse\">\n              <path d=\"M0,0 L8,3.5 L0,7 Z\" fill=\"var(--signal-gold)\"><\u002Fpath>\n            <\u002Fmarker>\n          <\u002Fdefs>\n\n          <!-- edges first -->\n          <path class=\"me\" d=\"M270,100 L389,100\" marker-end=\"url(#mah)\"><\u002Fpath>\n          <path class=\"me\" d=\"M270,340 L389,340\" marker-end=\"url(#mah)\"><\u002Fpath>\n          <path class=\"me\" d=\"M605,100 L662,100 Q680,100 680,118 L680,182 Q680,200 698,200 L726,200\" marker-end=\"url(#mah)\"><\u002Fpath>\n          <path class=\"me-trace\" d=\"M605,340 L662,340 Q680,340 680,322 L680,258 Q680,240 698,240 L724,240\" marker-end=\"url(#mahg)\"><\u002Fpath>\n\n          <!-- A: the gate (feature) -->\n          <rect class=\"mn\" x=\"60\" y=\"58\" width=\"210\" height=\"84\" rx=\"10\"><\u002Frect>\n          <text class=\"mn-t\" x=\"80\" y=\"92\">the gate<\u002Ftext>\n          <text class=\"mn-i\" x=\"80\" y=\"116\">REQ-CHECK-006<\u002Ftext>\n\n          <!-- B: next steps (feature) -->\n          <rect class=\"mn\" x=\"60\" y=\"298\" width=\"210\" height=\"84\" rx=\"10\"><\u002Frect>\n          <text class=\"mn-t\" x=\"80\" y=\"332\">next steps<\u002Ftext>\n          <text class=\"mn-i\" x=\"80\" y=\"356\">REQ-NEXT-009<\u002Ftext>\n\n          <!-- C: scanning (bus) -->\n          <rect class=\"mn-bus\" x=\"395\" y=\"58\" width=\"210\" height=\"84\" rx=\"10\"><\u002Frect>\n          <text class=\"mn-t\" x=\"415\" y=\"92\">code scanning<\u002Ftext>\n          <text class=\"mn-i\" x=\"415\" y=\"116\">CORE-SCAN-002<\u002Ftext>\n\n          <!-- D: drift detection (bus) -->\n          <rect class=\"mn-bus\" x=\"395\" y=\"298\" width=\"210\" height=\"84\" rx=\"10\"><\u002Frect>\n          <text class=\"mn-t\" x=\"415\" y=\"332\">drift detection<\u002Ftext>\n          <text class=\"mn-i\" x=\"415\" y=\"356\">CORE-DRIFT-003<\u002Ftext>\n\n          <!-- E: requirement reading (bus, located) -->\n          <rect class=\"mn-ring\" x=\"725\" y=\"173\" width=\"216\" height=\"94\" rx=\"13\"><\u002Frect>\n          <rect class=\"mn-bus\" x=\"730\" y=\"178\" width=\"206\" height=\"84\" rx=\"10\"><\u002Frect>\n          <text class=\"mn-t\" x=\"750\" y=\"212\">requirement reading<\u002Ftext>\n          <text class=\"mn-i\" x=\"750\" y=\"236\">CORE-PARSE-001<\u002Ftext>\n        <\u002Fsvg>\n      <\u002Fdiv>\n      <div class=\"maplegend\">\n        <span class=\"lg\"><span class=\"sw feature\"><\u002Fspan>feature — built on the bus<\u002Fspan>\n        <span class=\"lg\"><span class=\"sw bus\"><\u002Fspan>bus — shared foundation<\u002Fspan>\n        <span class=\"lg\"><span class=\"ln dep\"><\u002Fspan>depends on<\u002Fspan>\n        <span class=\"lg\"><span class=\"ln trace\"><\u002Fspan>traced path · centered node<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================== CONSOLE / COMMANDS ===================== -->\n<section data-screen-label=\"Console\">\n  <div class=\"wrap\">\n    <div class=\"two\">\n      <div class=\"copy reveal\">\n        <p class=\"eyebrow muted\">The console<\u002Fp>\n        <h3>The gate, on your terminal.<\u002Fh3>\n        <p>The engine is one stdlib-only Python file with a handful of subcommands. In CI you only need <code class=\"mono\" style=\"color:var(--accent);font-size:14px\">check<\u002Fcode> — it returns a non-zero exit code, so a failing build blocks the merge.<\u002Fp>\n        <ul class=\"cmdlist\">\n          <li><code>req init<\u002Fcode><span>Bootstrap: scaffold, draft from code, lock + map.<\u002Fspan><\u002Fli>\n          <li><code>req next<\u002Fcode><span>What to do next — actionable risk buckets.<\u002Fspan><\u002Fli>\n          <li><code>req check<\u002Fcode><span>The gate: link sync + drift. Exit 1 on error.<\u002Fspan><\u002Fli>\n          <li><code>req map<\u002Fcode><span>Render the interactive map + graph JSON.<\u002Fspan><\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"reveal\">\n        <div class=\"term\"><span class=\"pr\">$<\u002Fspan> <span class=\"cmd\">req check<\u002Fspan>\n<span class=\"red\">ERROR<\u002Fspan>  REQ-SYNC-014 → dangling tag <span class=\"dim\">src/sync.py:88<\u002Fspan>\n<span class=\"amb\">WARN<\u002Fspan>   CORE-DRIFT-003 drift <span class=\"dim\">reqmap.py:209-240<\u002Fspan>\n<span class=\"amb\">WARN<\u002Fspan>   REQ-MAP-007 has no tested-by member\n<span class=\"dim\">────────────────────────────────────────<\u002Fspan>\n13 requirements · 41 members · <span class=\"red\">1 error<\u002Fspan> · <span class=\"amb\">2 warnings<\u002Fspan>\n<span class=\"dim\">exit 1 — build blocked<\u002Fspan>\n<span class=\"pr\">$<\u002Fspan> <span class=\"acc\">_<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================== PACKAGING ===================== -->\n<section data-screen-label=\"Packaging\">\n  <div class=\"wrap\">\n    <div class=\"sec-head reveal\">\n      <p class=\"eyebrow muted\">How it ships<\u002Fp>\n      <h2>One plugin, one skill, one file.<\u002Fh2>\n      <p>There’s no service to run and nothing to <code>pip install<\u002Fcode>. The engine is a single ~1000-line, dependency-free Python script that gets copied into your repo.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"ship\">\n      <div class=\"step reveal\">\n        <div class=\"lbl\">Install once<\u002Fdiv>\n        <h4>Claude Code plugin<\u002Fh4>\n        <p>The repo is a plugin marketplace. <code>/plugin install<\u002Fcode> adds it to your toolbelt.<\u002Fp>\n        <span class=\"ar\">→<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"step reveal\">\n        <div class=\"lbl\">Invoke<\u002Fdiv>\n        <h4>The skill<\u002Fh4>\n        <p>The <code>requirement-manager<\u002Fcode> skill runs in any repo and, on first use, seeds the engine.<\u002Fp>\n        <span class=\"ar\">→<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"step reveal\">\n        <div class=\"lbl\">Runs anywhere<\u002Fdiv>\n        <h4>reqmap.py<\u002Fh4>\n        <p>A hermetic, stdlib-only script lands in <code>scripts/<\u002Fcode>. Commit it and the gate works in CI with no plugin present.<\u002Fp>\n        <span class=\"ar\">→<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================== FIRST RUN ===================== -->\n<section data-screen-label=\"First run\">\n  <div class=\"wrap\">\n    <div class=\"sec-head reveal\">\n      <p class=\"eyebrow muted\">First run<\u002Fp>\n      <h2>Install, then <code style=\"font:inherit;color:var(--accent)\">init<\u002Fcode> — once.<\u002Fh2>\n      <p>After the plugin is installed, invoke the <code>requirement-manager<\u002Fcode> skill in your repo. On first use it seeds the engine, then <code>init<\u002Fcode> does the whole bootstrap in one shot. It’s idempotent — safe to re-run.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"two\">\n      <div class=\"copy reveal\">\n        <p style=\"font: var(--text-caption); font-weight:600; letter-spacing:var(--track-caps); text-transform:uppercase; color:var(--fg-muted); margin:0 0 14px;\">What <code style=\"font-family:var(--font-mono);color:var(--accent)\">init<\u002Fcode> sets up<\u002Fp>\n        <ul class=\"initsteps\">\n          <li><span class=\"ck\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg><\u002Fspan><span>Seeds <code>scripts/reqmap.py<\u002Fcode> — the dependency-free engine — into your repo.<\u002Fspan><\u002Fli>\n          <li><span class=\"ck\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg><\u002Fspan><span>Creates the <code>requirements/<\u002Fcode> folder and a starter <code>.reqmapignore<\u002Fcode>.<\u002Fspan><\u002Fli>\n          <li><span class=\"ck\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg><\u002Fspan><span>Drafts a requirement per file from your existing code — all <code>draft<\u002Fcode> status.<\u002Fspan><\u002Fli>\n          <li><span class=\"ck\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg><\u002Fspan><span>Builds the lock baseline and the map, then prints guided next steps.<\u002Fspan><\u002Fli>\n        <\u002Ful>\n        <div class=\"pathchip\">\n          <span class=\"pc-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z\"><\u002Fpath><path d=\"M14 2v4a2 2 0 0 0 2 2h4\"><\u002Fpath><path d=\"M16 13H8\"><\u002Fpath><path d=\"M16 17H8\"><\u002Fpath><path d=\"M10 9H8\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n          <span><span class=\"pc-path\">requirements/_map.html<\u002Fspan><span class=\"pc-sub\">Your map lands here — double-click to open, no server needed. (Also: <code style=\"font-family:var(--font-mono);font-size:11.5px\">_map.md<\u002Fcode>, <code style=\"font-family:var(--font-mono);font-size:11.5px\">_map.json<\u002Fcode>.)<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"reveal\">\n        <div class=\"term\"><span class=\"pr\">$<\u002Fspan> <span class=\"cmd\">req init<\u002Fspan>\n<span class=\"grn\">✓<\u002Fspan> seeded <span class=\"dim\">scripts/reqmap.py<\u002Fspan>\n<span class=\"grn\">✓<\u002Fspan> created <span class=\"dim\">requirements/<\u002Fspan> + <span class=\"dim\">.reqmapignore<\u002Fspan>\n<span class=\"grn\">✓<\u002Fspan> drafted <span class=\"acc\">13<\u002Fspan> requirements from code <span class=\"dim\">(draft)<\u002Fspan>\n<span class=\"grn\">✓<\u002Fspan> wrote <span class=\"dim\">requirements/_reqlock.json<\u002Fspan>\n<span class=\"grn\">✓<\u002Fspan> wrote <span class=\"dim\">_map.html · _map.md · _map.json<\u002Fspan>\n<span class=\"dim\">────────────────────────────────────────<\u002Fspan>\n<span class=\"amb\">→<\u002Fspan> open <span class=\"acc\">requirements/_map.html<\u002Fspan> to browse\n<span class=\"amb\">→<\u002Fspan> review drafts, then <span class=\"cmd\">req promote &lt;ID&gt;<\u002Fspan>\n<span class=\"pr\">$<\u002Fspan> <span class=\"acc\">_<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================== WHEN TO USE ===================== -->\n<section data-screen-label=\"When to use\">\n  <div class=\"wrap\">\n    <div class=\"sec-head reveal\">\n      <p class=\"eyebrow muted\">When to reach for this<\u002Fp>\n      <h2>Best on a codebase that got ahead of its docs.<\u002Fh2>\n      <p>You don’t need this on a tidy, well-specified project. It earns its keep when the code and the intent behind it have quietly come apart — and you need to take the wheel again.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"grid3\">\n      <div class=\"vcard reveal\">\n        <div class=\"vrow\">\n          <span class=\"badge tint-amber\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 7V5a2 2 0 0 1 2-2h2\"><\u002Fpath><path d=\"M17 3h2a2 2 0 0 1 2 2v2\"><\u002Fpath><path d=\"M21 17v2a2 2 0 0 1-2 2h-2\"><\u002Fpath><path d=\"M7 21H5a2 2 0 0 1-2-2v-2\"><\u002Fpath><path d=\"M7 12h10\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n          <div><h3>Legacy with no spec<\u002Fh3><div class=\"kicker\">inherited code<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <p>You’ve got a brownfield repo and no written requirements. <code>extract<\u002Fcode> walks the code and drafts a first-pass requirement per file, so you start from a map instead of a blank page.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"vcard reveal\">\n        <div class=\"vrow\">\n          <span class=\"badge tint-magenta\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8\"><\u002Fpath><path d=\"M3 3v5h5\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n          <div><h3>Vibecoding got ahead of you<\u002Fh3><div class=\"kicker\">lost the thread<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <p>You generated a lot of code fast and lost track of what’s actually in there. <code>next<\u002Fcode> and the Risk tab list what’s orphaned, untested, or drifted — a worklist for taking back control, with each item small enough to fix on the spot.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"vcard reveal\">\n        <div class=\"vrow\">\n          <span class=\"badge tint-coral\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"><\u002Fcircle><path d=\"m21 21-4.3-4.3\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n          <div><h3>Dead code &amp; half-built features<\u002Fh3><div class=\"kicker\">loose ends<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <p>Scanning flags code no requirement claims — possible dead code — and <strong>orphan<\u002Fstrong> requirements: things you declared but never finished. Once they’re listed, each half-built feature or lurking bug becomes a small, obvious fix.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fmain>\n\n<footer>\n  <div class=\"wrap\">\n    <div class=\"foot\">\n      <svg class=\"mk\" width=\"22\" height=\"22\" viewBox=\"0 0 64 64\" fill=\"none\" aria-hidden=\"true\">\n        <defs><linearGradient id=\"lgFoot\" x1=\"10\" y1=\"8\" x2=\"54\" y2=\"56\" gradientUnits=\"userSpaceOnUse\"><stop offset=\"0\" stop-color=\"#2160c6\"><\u002Fstop><stop offset=\"1\" stop-color=\"#c0206a\"><\u002Fstop><\u002FlinearGradient><\u002Fdefs>\n        <circle cx=\"32\" cy=\"32\" r=\"28.5\" stroke=\"url(#lgFoot)\" stroke-width=\"3\"><\u002Fcircle>\n        <line x1=\"25\" y1=\"25\" x2=\"39\" y2=\"39\" stroke=\"#8d8fa3\" stroke-width=\"2.6\"><\u002Fline>\n        <rect x=\"17\" y=\"17\" width=\"14\" height=\"14\" rx=\"2.5\" stroke=\"#2160c6\" stroke-width=\"2.6\"><\u002Frect>\n        <rect x=\"33\" y=\"33\" width=\"14\" height=\"14\" rx=\"2.5\" fill=\"#f5a623\"><\u002Frect>\n      <\u002Fsvg>\n      <span class=\"quote\">“One fact, one home. Reference ids; never copy a contract into a README.”<\u002Fspan>\n      <span class=\"refs\">\n        <span>README.md<\u002Fspan>\n        <span>SKILL.md<\u002Fspan>\n        <span>scripts/reqmap.py<\u002Fspan>\n      <\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<script>\n  // gentle scroll-reveal — respects reduced-motion via the CSS gate above\n  (function () {\n    var els = document.querySelectorAll('.reveal');\n    if (!('IntersectionObserver' in window) || matchMedia('(prefers-reduced-motion: reduce)').matches) {\n      els.forEach(function (e) { e.classList.add('in'); });\n      return;\n    }\n    var io = new IntersectionObserver(function (entries) {\n      entries.forEach(function (en) {\n        if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); }\n      });\n    }, { threshold: 0.12, rootMargin: '0px 0px -8% 0px' });\n    els.forEach(function (e) { io.observe(e); });\n  })();\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"

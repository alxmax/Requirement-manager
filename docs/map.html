      "intent": "A `tested-by:` link says a test exists, not how close that test sits to the code — a whole-system run and a single-function check look identical to the tool. This lets a tag name its level, and lets a stakeholder need point at the evidence it was met. Without it the engine models only the left side of the V: you can ask what a requirement depends on, but not \"has anyone ever shown this need was actually satisfied?\".",

        "The level scan stays separate from the member scan, so the member shape every consumer reads is unchanged.",
        "The engine skips a levelled tag written inside backticks, so a documented example never counts as real coverage.",
        "In a Python file the engine also skips a levelled tag inside a string literal or a docstring. Prose about how to tag is not a claim of coverage.",

        "The gate applies the level-fit rule to the `bus` layer only. A feature may legitimately be covered end to end.",
        "Both rules are warn-only. Neither changes the gate's exit code.",

indented `- item`.","A trailing `# comment` is stripped from a value.","Matching surrounding quotes are removed from a scalar.","An inline list missing its closing `]` is parsed leniently, rather than kept as a literal string.","A file with no leading `---` block yields empty `meta` and the whole text as `body`.","A file whose name starts with `_` (a lock, the generated map) is excluded.","A leading UTF-8 BOM is tolerated."],acc:["A file with valid frontmatter yields its scalar and list fields in `meta`.","A file without a leading `---` block returns empty `meta` and the whole text as body.","Files starting with `_` are excluded from the result."],impl:["`parse_frontmatter`, `load_requirements` in `reqmap.py`."],members:[{role:"implements",loc:"scripts/reqmap.py:73-128"},{role:"tested-by",loc:"scripts/test_reqmap.py:47-800"}],deps:[],usedBy:["REQ-CHECK-006","REQ-FINDINGS-010","REQ-MAP-007","REQ-NEW-004","REQ-PROMOTE-011","REQ-SCAN-005"],risks:[{signal:"blast-radius",advice:"High fan-in — many capabilities depend on this. Change it only behind its contract, run the full gate + dependents' tests."}]},{id:"CORE-SCAN-002",area:"CORE",title:"Member discovery",layer:"bus",status:"confirmed",intent:"Find every place in the code that claims membership of a capability, by scanning for tags.",contract:["`scan_members` walks a code root and, in every source file with a known extension, finds the inline tags.","`scan_members` returns `cap_id -> [(role, relative_file, line), ...]`.","A role is one of `implements`, `generated-from`, `validated-against` and `tested-by`.","A tag ID matches `[A-Z][A-Z0-9]*(-[A-Z0-9]+)+`.","A left-boundary guard prevents a substring match such as `reimplements:` or `x-implements:` being read as a real tag.","The same `(role, ID)` appearing twice on one line is recorded once.","File paths are reported repo-root-relative, with POSIX separators.","A single tag may bind several requirements through a comma-separated id list, written `role: <ID>, <ID>, ...`.","Each id in that list is recorded as a member of the same `(role, file, line)`.","A whole-system doc generated from many requirements (`generated-from: A, B, C`) is therefore a member of each, and drifts when ANY of them changes.","`.git`, `node_modules`, `__pycache__` and the SSOT `requirements/` directory are skipped.","The SSOT directory is matched by realpath, so a source package merely named `requirements/` is still scanned.","Paths matching `.reqmapignore` are excluded.","An unreadable file is skipped without aborting the scan.","`scan_all` returns the members, the per-criterion coverage and the verification levels from a single walk, and each result equals what the three separate scanners return."],acc:["A file containing `# implements: <ID>` produces a member `(implements, file, line)` under `<ID>`.","Excluded directories are not scanned; member paths are POSIX-relative.","An unreadable file is skipped without aborting the scan."],impl:["`scan_members`, `_prune_dirs`, `load_ignore`, `TAG_RE` in `reqmap.py`."],members:[{role:"implements",loc:"scripts/reqmap.py:144-181"},{role:"tested-by",loc:"scripts/test_reqmap.py:146"}],deps:[],usedBy:["REQ-CANDIDATES-009","REQ-CHECK-006","REQ-EXTRACT-008","REQ-MAP-007","REQ-SCAN-005"],risks:[{signal:"blast-radius",advice:"High fan-in — many capabilities depend on this. Treat it as shared foundation (bus)."}]},{id:"CORE-DRIFT-003",area:"CORE",title:"Contract hashing & lock",layer:"bus",status:"confirmed",intent:"Detect when a requirement's binding contract changes, so stale code can be re-checked.",contract:["`binding_hash` computes a stable 12-character hex content hash over only the normative sections of a requirement body.","The normative sections are the `Contract` and `Acceptance` headings, plus the legacy `Input`/`Output`/`Acceptance` headings kept for back-compat.","Rationale, notes, verify-intent, links and the member list stay outside the hash, so they may change without tripping drift.","The hash is deterministic for identical normative content.","`load_lock` and `save_lock` read and write the per-id hash baseline at `requirements/_reqlock.json`.","A missing, empty or unparseable lock loads as an empty mapping, never a crash.","`save_lock` creates the requirements directory if it is absent.","`save_lock` writes sorted, indented JSON, so the lock file is diff-stable."],acc:["Editing only the Description/Notes section does not change the hash.","Editing the Contract section changes the hash.","`load_lock` on a missing or corrupt lock file returns an empty dict (no crash)."],impl:["`binding_hash`, `lock_path`, `load_lock`, `save_lock` in `reqmap.py`."],members:[{role:"implements",loc:"scripts/reqmap.py:209-240"},{role:"tested-by",loc:"scripts/test_reqmap.py:103-116"}],deps:[],usedBy:["REQ-CHECK-006"],risks:[{signal:"drift",advice:"Lock hash differs from current contract. Re-check the named members, then `check --update-lock`."}],drift:!0},{id:"REQ-CHECK-006",area:"REQ",title:"The gate",layer:"feature",status:"confirmed",intent:"Fail the build when code and requirements have fallen out of sync.",contract:["`gate` reports an `ERROR` and exits non-zero for every condition in this group.","A dangling tag — a code tag referencing a capability no requirement defines — is such a condition.","An invalid `status` or an invalid `layer` is such a condition.","A `depends_on` pointing at a missing id is such a condition.","An enforced requirement with no `implements:` member is such a condition.","A requirement is enforced when its status is `in-progress`, `implemented` or `confirmed`.","A `layer: need` requirement is exempt from that `implements:` rule — see [[REQ-TRACE-020]].","`gate` reports drift as a `WARN`, never an error: a `confirmed` requirement whose binding hash differs from the lock.","The drift warning names the member `file:line` locations to re-check.","A `confirmed` requirement with no `tested-by:` member is a `WARN`.","A requirement carrying a `test_exempt: <reason>` opt-out in its frontmatter is exempt from that test warning.","A `layer: need` requirement is exempt from it too.","A `confirmed` requirement missing a `## WHAT — Contract` section is a `WARN`, in both the `bus` and `feature` layers. It does not affect the exit code.","A `confirmed` requirement missing a `## HOW — Acceptance` section is a `WARN`, in both the `bus` and `feature` layers. It does not affect the exit code.","The requirement `milestone:` field is optional. When present it matches the version shape `v<digits>[.<digits>…]`, for example `v1.14`.","A malformed `milestone:` value is a `WARN`, because that field is roadmap-only metadata and never build-critical.","A `deprecated` requirement is exempt from the `milestone:` shape check.","A present-but-unreadable `_reqlock.json` is a `WARN`. Drift is skipped for that run rather than crashing.","A lock sidecar (`_reqlock.json` or `_memberlock.json`) that exists on disk but is **not git-tracked** is a `WARN` naming the file.","An uncommitted lock silently disables drift detection on a fresh CI checkout, which has no baseline to compare against.","That git-tracking check is fail-open: `gate` stays silent when git is unavailable or the tree is not a work tree.","`gate` names every requirement whose body lacks a `## WHAT — Verify intent` section in one aggregated legacy-schema `WARN`.","`gate` counts those legacy-schema requirements in the summary.","The legacy-schema warning does not affect the exit code.","A confirmed `need` with no `validated-against:` member is a `WARN`, once the repo carries at least one such tag (see [[REQ-VLEVEL-037]]).","A confirmed `bus` requirement whose levelled `tested-by:` links are all `@system` is a `WARN`.","`gate` prints an advisory line carrying the open verify-intent finding count when that count is above zero.","That advisory line does not affect the exit code.","`gate` prints a summary of requirements, members, errors and warnings.","With `--update-lock`, `gate` writes the current binding hashes to `requirements/_reqlock.json`.","`sync` and the deprecated `check` alias pass `--update-lock`.","The `gate` verb itself is report-only."],acc:["A tag referencing a non-existent capability produces an `ERROR` and exit 1.","A `confirmed` requirement with no `implements` member produces an `ERROR`.","A drifted contract produces a `WARN` (not an error) naming the member locations."],impl:["`cmd_check`, `warn_if_stale` in `reqmap.py`."],members:[{role:"implements",loc:"scripts/reqmap.py:247-296"},{role:"tested-by",loc:"scripts/test_reqmap.py:93-958"}],deps:["CORE-PARSE-001","CORE-SCAN-002","CORE-DRIFT-003"],usedBy:["REQ-INIT-012"],risks:[]},{id:"REQ-EXTRACT-008",area:"REQ",title:"Legacy extraction",layer:"feature",status:"confirmed",intent:"Bootstrap a registry on a brownfield codebase by proposing draft requirements from untagged code.",contract:["`draft` walks the untagged source files ending in `.py`, `.js`, `.ts`, `.c` or `.cpp`.","`draft` skips a file that already carries a member tag.","`draft` honors `.reqmapignore`, the same fnmatch globs `scan` respects.","A file matching an ignore pattern is never drafted — notably the vendored `scripts/reqmap.py` engine itself.","`draft` proposes one `requirements/DRAFT-*.md` per remaining file.","Every proposal carries `status: draft` and a TODO body. It captures observed behavior, and never canonizes intent or correctness.",'A proposal\'s Contract section opens with "Every line in this section is binding.", matching what `new` scaffolds, so promoting a draft needs no reshaping.',"`draft` creates the requirements directory if it is absent.","Draft ids are path-aware, so two files sharing a basename do not collide.","`draft` assigns a cheap risk score from `TODO`/`FIXME`/`HACK`/`XXX` markers, suppressions and file size.","`draft` routes a score of 2 or more to `REVIEW`, and any lower score to `auto-baseline`.","Re-running `draft` never overwrites an existing draft."],acc:["An untagged `.py`/`.js`/`.ts`/`.c`/`.cpp` file yields one `DRAFT-*` draft.","A file matching a `.reqmapignore` pattern is skipped (no draft proposed).","A file containing `TODO`/`FIXME` scores higher risk and is flagged `REVIEW`."],impl:["`cmd_extract`, `_draft_id`, `_risk`, `classify_prose` in `reqmap.py`."],members:[{role:"implements",loc:"scripts/reqmap.py:495-641"},{role:"tested-by",loc:"scripts/test_reqmap.py:194-429"}],deps:["CORE-SCAN-002"],usedBy:["REQ-INIT-012"],risks:[]},{id:"REQ-CANDIDATES-009",area:"REQ",title:"Capability candidates",layer:"feature",status:"confirmed",intent:"Stage 1 of AI extraction: emit a deterministic capability plan from legacy code, writing no requirement files.",contract:["`plan` emits a single JSON object, to stdout or to `--out PATH`, shaped `{engine_version, bus[], candidates[]}`.","`plan` writes NO `.md` files. It cannot repeat `draft`'s empty-stub failure.","`plan` walks the code with the same exclusions as scanning: noise dirs, the SSOT dir, and `.reqmapignore` resolved in `requirements/` first.","`plan` gathers per-file facts: module and symbol docstrings, top-level signatures, import targets, and line count.","`plan` reads top-level signatures from Python via `ast`, and from JS/TS via best-effort parsing.","An unparseable file yields empty facts. It never aborts the plan.","Each candidate carries `{suggested_id, suggested_layer, files[], docstrings{}, signatures[], imports[], depends_on[], tested_by[], importer_count, existing_req, loc, split_candidate}`.","`depends_on` is derived from imports resolved to other candidates.","`suggested_layer` is `bus` when `importer_count ≥ BUS_FANIN_THRESHOLD`, else `feature`.","A file already carrying an `implements:` tag is reported via `existing_req`.","`plan` groups files by `requirements/_capmap.json` when that file is present, and treats it as authoritative.","Absent `_capmap.json`, `plan` falls back to one candidate per file."],acc:["Running `candidates` writes zero `.md` files and emits valid JSON.","An import of a local module yields a `depends_on` edge to that module's candidate.","A module imported by ≥ the bus threshold is suggested as `bus`."],impl:["`cmd_candidates`, `_py_facts`, `_js_facts`, `_load_capmap` in `reqmap.py`."],members:[{role:"implements",loc:"scripts/reqmap.py:658-805"},{role:"tested-by",loc:"scripts/test_reqmap.py:521-908"}],deps:["CORE-SCAN-002"],usedBy:[],risks:[]},{id:"REQ-FINDINGS-010",area:"REQ",title:"Open-findings report",layer:"feature",status:"confirmed",intent:`Roll up every requirement's open "verify intent" questions into one reviewable _findings.md.`,contract:["`findings` scans every requirement and collects the bullet items under each one's `## WHAT — Verify intent` section.","`findings` writes them into a single `_findings.md` in the requirements directory.",'`findings` excludes the "None — …" placeholder bullet. A requirement that recorded no open question therefore contributes nothing.',"In raw mode, `findings` groups the findings by requirement.","Each group and the document header carry a count.","With zero findings, `findings` still writes a well-formed file stating that none are open.","With the raw flag set, `findings` ignores any sidecar and emits the raw grouped list.","When the sidecar exists and raw mode is off, `findings` renders a classified view.","That view puts confirmed bugs first, ordered by severity from high to low, then product/config decisions, then intentional, then false-positive.","A bug entry shows its location and its recommended fix when those are present.","`findings` emits an advisory staleness note when the count of raw verify-intent items differs from the count of triaged items in the sidecar.","`findings` is deterministic and stdlib-only. It never classifies a finding itself.","`findings` writes no file other than `_findings.md`.","The gate prints a non-error advisory line carrying the open-findings count, whenever that count is greater than zero.","The open-findings count never changes the gate's exit code."],gwt:`AC-1
  Given  two requirements, one with two Verify-intent bullets and one with only the "None —" placeholder
  When   findings runs in raw mode
  Then   _findings.md lists the two bullets and reports "2 open finding(s) across 1 requirement(s)"`,impl:["`cmd_findings`, `render_findings` in `reqmap.py`."],members:[{role:"implements",loc:"scripts/reqmap.py:911-998"},{role:"tested-by",loc:"scripts/test_reqmap.py:594-891"}],deps:["CORE-PARSE-001"],usedBy:[],risks:[]},{id:"REQ-MAP-007",area:"REQ",title:"Requirement map (HTML + MD)",layer:"feature",status:"confirmed",intent:"Render the whole registry as navigable diagrams a human can read at a glance.",contract:["`map` generates two files under `requirements/`: `_map.md` and `_map.json`.","`_map.md` holds Mermaid diagrams for static GitHub/GitLab rendering.","`_map.json` holds a `{engine_version, repo, nodes, edges, todos}` graph for an external front-end.","Both files are derived views. They are regenerated, never edited.","`_map.json` carries one node per requirement and one edge per `depends_on`.","Each node carries its requirement's id, layer, status, area, title, intent, Contract/Verify-intent/Notes bullets, acceptance, members (`role`/`loc`), `deps`, `used_by`, and risk signals.","That is the same `{nodes, edges}` shape the diagrams are built from.","`_map.json` carries a top-level `repo` field: a best-effort `owner/repo`, else the repo directory name, else null.","`repo` identifies the project the map describes, for display in the viewer header.","`repo` is derived from the git remote, so it differs across forks and clones. It is therefore excluded from the `map --check` freshness diff.","Resolving `repo` never raises and never blocks map generation, because git may be absent or the tree may not be a checkout.","`_map.json` carries a top-level `todos` array, derived from `TODO.md` via `_parse_todos`, so the viewer's Roadmap tab can show planned work alongside requirements.","Reading a requirement's clauses folds a wrapped line back into the clause above it, so a multi-line clause is never truncated to its first physical line.","A clause-group label groups the clauses below it: a bold-only line written flush left. A label is a heading, not a clause, and never folds into the clause above.","Position decides a label, not the bold markers alone. An indented wrapped line folds even when it opens and closes on bold spans, so a two-part clause keeps both halves.","`_map.md` contains exactly 4 Mermaid code blocks: System Map, Req→Code, Dependencies and Risk.","Each of those 4 blocks carries a legend.","A node's area is its `area:` field, or its id prefix when that field is absent.","The System Map groups nodes into per-area subgraphs, and collapses a single-node area into a `misc` box.","The System Map omits a `depends_on` edge whose target is a bus node or a high-fan-in hub.","The Dependency Map is area-level: one node per area, carrying a capability count.","The Dependency Map draws an edge A→B when some capability in A depends on one in B. Per-capability hub edges are not drawn.","Req→Code colors an enforced-but-unlinked requirement red, and a baseline or draft not-yet-linked one muted grey.","Req→Code collapses multiple members in one file to a min–max line range.","The Risk diagram shows only requirements with at least one risk signal (confirmed with zero members; `draft`/`baseline`; ≥3 dependents).","The Risk diagram pairs each of them with a scripted recommendation.","A `draft`'s open verify-intent question is suppressed, subsumed by its `unreviewed` signal, so a draft is not double-flagged.","That dedup lives in `_risk_signals`, shared with the `next` worklist.","All requirement-derived text is JSON-encoded in `_map.json`, which neutralizes any hostile id, title or body by construction. There is no markup context to break out of.","The self-contained HTML viewer ([[REQ-VIEWER-007]]) and the GitHub Pages publish+gate ([[REQ-PAGES-021]]) are separate capabilities. They consume this map's `_map.json` and `_map.html`."],acc:["The generated files contain one node per requirement and one edge per `depends_on`.","`_map.md` contains 4 Mermaid code blocks, each with a legend.","`_map.json` parses to `{engine_version, nodes, edges}` with one node per requirement."],impl:["`cmd_map`, `render_html`, `render_md`, the `_mermaid_*` generators in `reqmap.py`."],members:[{role:"implements",loc:"scripts/reqmap.py:1033-1948"},{role:"tested-by",loc:"scripts/test_reqmap.py:237-1069"}],deps:["CORE-PARSE-001","CORE-SCAN-002"],usedBy:["REQ-INIT-012","REQ-NEXT-013"],risks:[]},{id:"REQ-NEW-004",area:"REQ",title:"Scaffold a requirement",layer:"feature",status:"confirmed",intent:"Create a new requirement file from the template, so every capability starts in the same shape.",contract:["Given a capability id, `new` writes `requirements/<ID>.md`, stamped from the scaffold with the placeholder `AREA-NAME-NNN` replaced by that id.","`new` creates the requirements directory if it is absent.","The scaffold is the engine's built-in template.","An on-disk `templates/requirement.md`, when present, overrides the built-in template.","`new` refuses to overwrite an existing file. It exits non-zero and writes nothing.",'The emitted Contract section opens with "Every line in this section is binding.", so the author writes clauses in present tense without a `shall` or `must` on each line.',"The scaffold's guidance names the authoring rules the linter enforces, so a file written from it starts clean."],acc:["`new FOO-NEW-099` on an empty registry creates `requirements/FOO-NEW-099.md` with that id.","Running `new` for an id that already exists exits non-zero and writes nothing."],impl:["`cmd_new`, `REQUIREMENT_TEMPLATE` in `reqmap.py`."],members:[{role:"implements",loc:"scripts/reqmap.py:425"},{role:"tested-by",loc:"scripts/test_reqmap.py:463"}],deps:["CORE-PARSE-001"],usedBy:[],risks:[]},{id:"REQ-PROMOTE-011",area:"REQ",title:"Promote",layer:"feature",status:"confirmed",intent:"One command to perform the human-validation step — flip a reviewed requirement to confirmed.",contract:["`confirm <ID>` sets the requirement's `status` to `confirmed`.","`confirm` edits only the value of the first `status:` line in the leading frontmatter.","`confirm` preserves that line's indentation and any trailing inline comment.","`confirm` leaves the body untouched.","`confirm` refuses a requirement with no `implements:` member: it exits non-zero and writes nothing. A `confirmed` requirement with no code is a gate error.","A refusal prints the tag the caller needs to add.","`confirm` exits non-zero with a clear message for an unknown id, meaning no `requirements/<ID>.md` exists.","`confirm` warns, without failing, when no `tested-by:` member is linked.","That warning points at the test tag to add, or at the `test_exempt:` opt-out.","`confirm` reminds the caller to refresh the lock and regenerate the map afterwards.","`confirm` is idempotent. An already-`confirmed` requirement is reported, left unchanged, and exits zero."],gwt:`AC-1

reading it.",'"Describes itself" means `scripts/reqmap.py` carries tags whose ids match requirements already in the repo.',"`init` drafts requirements from untagged code, writes the lock, then builds the map, in that order. When it finishes, the repo passes the gate and has a map.","`init` ends with a short summary naming one next command: `reqmap.py next`. Not a list of every option.","If nothing was drafted, `init` says so in plain words and points at `new`. It never prints a count summary that hides an empty result.","Running `init` twice is safe. The second run refreshes the lock and the map, then prints the summary again.","A second run never deletes a requirement someone wrote, and never edits an existing `.reqmapignore`."],acc:["`init` on a fresh repo creates `requirements/` and a `.reqmapignore`.","After `init`, `_map.md`, `_map.json` and the drift lock exist.",'`init` on a repo with no extractable code prints the distinct "no requirements were extracted" message.'],impl:["`cmd_init` in `reqmap.py` — orchestrates extract → check → map."],members:[{role:"implements",loc:"scripts/reqmap.py:1210-1237"},{role:"tested-by",loc:"scripts/test_reqmap.py:1265"}],deps:["REQ-EXTRACT-008","REQ-CHECK-006","REQ-MAP-007"],usedBy:[],risks:[]},{id:"REQ-NEXT-013",area:"REQ",title:"What-should-I-do-next report",layer:"feature",status:"confirmed",intent:"Render the map's risk surface in the terminal as counted, actionable buckets.",contract:["`next` groups every requirement's open risk signals into action buckets.","`next` reads those signals from `_risk_signals` and their wording from `RISK_ADVICE`, the same two sources that drive the Risk tab. There is never a second signal path.","`next` prints a progress header `N requirement(s) · X confirmed · Y tested · Z draft(s)` before the buckets.","In that header, `tested` counts the requirements that have a `tested-by` member.","`next` surfaces exactly the actionable buckets: `unimplemented` (Orphans), `untested` (Needs tests), `unverified-intent` (Needs intent review), `unreviewed` (Drafts to review).","`next` prints those four buckets in that order, most urgent first.","`next` omits `blast-radius`, because that signal is a caution, not a task.",'`next` surfaces every scannable file that carries no membership tag as an "Untagged files" bucket, ranked lowest of all.',"`next` skips that untagged scan when the caller gives no `code_root`.","Within a bucket, `next` orders items by `priority` rank, then by descending extract `risk:` score, then by id.","Priority rank runs `must-have` < `should-have` < `could-have` < `wont-have`. A requirement with no `priority` ranks last.","`next` tags an item whose `risk:` is 2 or more with `[REVIEW]`.","`next` names the requirement file to open, as `requirements/<ID>.md`.","By default `next` shows at most the top few items of a bucket.","`next` prints a `... N more` line when a bucket holds more items than it showed.","With `--all`, `next` lists every item.",'The "Untagged files" bucket truncates the same way as the others.','With a registry that holds no requirements, `next` prints a distinct "no requirements yet" message pointing at `init`/`new`. `next` never prints the all-clear line in that case.',"With requirements but no open signal, `next` prints the all-clear line.","`next` is deterministic and writes no file.","`next` always exits zero. The report is advice, not a gate."],acc:["The output starts with a progress header carrying confirmed/tested/draft counts.",'A confirmed requirement with code but no `tested-by` lists under "Needs tests".','An empty registry prints the "no requirements yet" message; it writes no files and returns 0.'],impl:["`cmd_next`, `_risk_score` in `reqmap.py`."],members:[{role:"implements",loc:"scripts/reqmap.py:1083-1093"},{role:"tested-by",loc:"scripts/test_reqmap.py:1174"}],deps:["REQ-MAP-007"],usedBy:[],risks:[]},{id:"DRAFT-cache-utils",area:"REQ",title:"cache_utils (drafted)",layer:"feature",status:"draft",intent:"TODO — obser
